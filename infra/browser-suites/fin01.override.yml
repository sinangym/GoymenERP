# FIN-01 (`browser:fin01`) — the suite's closed-list API extension (BROWSER-CI stage 2).
#
# Owner: FİNANS (Finance owner; suite owner). Validated with the merged model by
# tools/validate_browser_acceptance.py once the central writer registers the `fin01` suite
# (SUITES / its staged Finance profile, SUITE_API_EXTENSIONS["fin01"] = actors + identity,
# SUITE_IDENTITY_PERMISSIONS["fin01"] = the closed permission names below).
#
# Three synthetic actors after the canonical two, each with its Identity user, a synthetic role and a
# company-wide assignment in GDC (the company whose approved TRY money profile Settings answers).
# The approver also has one isolated GSP role containing only the already registered official-invoice
# approval permission. It exists solely to exercise a real company-context fence in the disposable suite.
# Company-wide because every Finance name is CompanyWideOnly. Disposable test database only: no
# production user, role or permission.
#   fin01-proposer: proposes the bank account and prepares the draft —
#                   finance.bank-account.read / .propose, finance.manual-receipt.draft.save / .draft.read,
#                   finance.manual-receipt.amount.read, counterparty.parties.read, and FIN-T05's
#                   finance.manual-receipt.record + accounting.periods.read pair (the latter is D1's
#                   caller-scoped period lookup; both exist only in this disposable test role), plus
#                   finance.manual-receipt.reverse.propose, plus manual outgoing-payment draft save/read, plus
#                   DEC-FIN-016's five finance.customer-instrument.* names (read / amount.read / receive /
#                   status.change / collect; user decision 2026-09-27: this disposable actor is their only holder),
#                   plus the party ledger's finance.party-ledger.read / .amount.read (user decision 2026-09-28:
#                   this disposable actor is their only holder), plus the official-invoice upload command.
#   fin01-approver: approves another person's proposal (Ö4) — finance.bank-account.read / .approve,
#                   finance.manual-receipt.reverse.approve, accounting.periods.read, and manual outgoing-payment
#                   draft read / approve / record. Its final record revalidates the selected party/account through
#                   the Cari owner, so this disposable actor also holds counterparty.parties.read. The same
#                   checker alone lists/details/approves official-invoice batches, then reads the approved source and
#                   creates/reopens/releases its F-03 allocation with separate read/write permissions.
#   fin01-reader:   reads F-03 allocations but cannot create one; it proves the form stays absent for a real
#                   allocation.read-only disposable actor instead of reusing the write-capable checker.
services:
  api:
    environment:
      BootstrapIdentity__Users__2__UserId: fin01-proposer
      BootstrapIdentity__Users__2__DisplayName: SENTETIK FIN01 Proposer
      BootstrapIdentity__Users__3__UserId: fin01-approver
      BootstrapIdentity__Users__3__DisplayName: SENTETIK FIN01 Approver
      BootstrapIdentity__Users__4__UserId: fin01-reader
      BootstrapIdentity__Users__4__DisplayName: SENTETIK FIN01 Allocation reader
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-00000000f101
