# PUR-01 Purchasing order acceptance. Three disposable actors are appended to the canonical development
# identities and exist only in the per-run SQL database. The creator can create/read and carries the two
# owner-read permissions the real Purchasing command already requires plus the two P-03 Document Vault
# permissions; the approver can read/approve and the reader can only read. The existing Product runtime's
# synthetic issuer binding enables its owned
# migrations before the gated fixture runs; its Identity user is not a Bootstrap actor and has no role,
# assignment or permission. Every actor assignment is company-wide in GDC. No production role,
# permission or user is changed.
# PUR-HOST goods receipt (#478): by the user's decision (#5831467690, coordinator session 2026-09-26) two more
# disposable actors exist only in this per-run database: the receiver holds exactly purchasing.orders.read +
# purchasing.goods-receipts.record (the record command, its location options, its history and its shell control),
# and a separate Inventory stock reader holds inventory.labels.read + inventory.balances.read to show the SAME
# label. No real user, production role or seeded role receives purchasing.goods-receipts.record.
