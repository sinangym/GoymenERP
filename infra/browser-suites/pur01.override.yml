# PUR-01 Purchasing order acceptance. Three disposable actors are appended to the canonical development
# identities and exist only in the per-run SQL database. The creator can create/read and carries the two
# owner-read permissions the real Purchasing command already requires; the approver can read/approve and
# the reader can only read. Every assignment is company-wide in GDC. No production role, permission or
# user is changed.
