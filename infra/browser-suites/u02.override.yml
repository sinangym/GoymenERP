# u02 (ÜRÜN): the suite's closed-list API extensions on top of the `normal` profile, validated by
# tools/validate_browser_acceptance.py with the merged model (SUITE_API_EXTENSIONS["u02"]).
#  - The Product runtime's issuer binding (#319 P3): both keys, lowercase v4 synthetic ids.
#  - The issuer's Identity user (coordinator: the issuer-user rule, a narrow extension of D1): the one
#    non-actor Identity user of this suite, equal to the issuer keys, subject u02-issuer (not a
#    BootstrapIdentity user, so it can never sign in), no role, no assignment, no permission.
#  - U-01-360 activation (#466, user decision 2026-09-27): ONE disposable sign-in actor, u02-activator, its
#    Identity user and a company-wide GDC membership in a non-system role whose only permission is the
#    baseline identity.profile.read (used by no endpoint or shell capability). The membership only
#    establishes the fresh origin membership Product authorization requires; the actor's Product master
#    Read + Activate grant is written by the gated u02 seed writer under the SYSTEM_ADMINISTRATOR grant role
#    (PRD-PERM-001 A), never here. No real user, production role or seeded role gains anything.
# Every value is synthetic and exists only in the run's disposable database. s03 shares the issuer values (D3).
services:
  api:
    environment:
      ProductRuntime__IssuerLocalUserId: b2000000-0000-4000-8000-000000000201
      ProductRuntime__IssuerExternalIdentityId: b2100000-0000-4000-8000-000000000201
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-000000000201
      IdentitySeed__Users__5__DisplayName: SENTETIK browser-suite:u02 Product issuer
      IdentitySeed__Users__5__ExternalIdentities__0__Id: b2100000-0000-4000-8000-000000000201
      IdentitySeed__Users__5__ExternalIdentities__0__Issuer: urn:goymen:development-bootstrap
      IdentitySeed__Users__5__ExternalIdentities__0__Subject: u02-issuer
      BootstrapIdentity__Users__2__UserId: u02-activator
      BootstrapIdentity__Users__2__DisplayName: SENTETIK browser-suite:u02 Product activator
      IdentitySeed__Users__6__Id: b2000000-0000-4000-8000-000000000210
      IdentitySeed__Users__6__DisplayName: SENTETIK browser-suite:u02 Product activator
      IdentitySeed__Users__6__ExternalIdentities__0__Id: b2100000-0000-4000-8000-000000000210
      IdentitySeed__Users__6__ExternalIdentities__0__Issuer: urn:goymen:development-bootstrap
      IdentitySeed__Users__6__ExternalIdentities__0__Subject: u02-activator
      IdentitySeed__Roles__5__Id: b3000000-0000-4000-8000-000000000210
      IdentitySeed__Roles__5__Code: BROWSER_U02_ACTIVATOR
      IdentitySeed__Roles__5__Name: SENTETIK browser-suite:u02 Product activator membership
      IdentitySeed__Roles__5__IsSystem: "false"
      IdentitySeed__Roles__5__Permissions__0: identity.profile.read
      IdentitySeed__Assignments__7__Id: b4000000-0000-4000-8000-000000000210
      IdentitySeed__Assignments__7__UserId: b2000000-0000-4000-8000-000000000210
      IdentitySeed__Assignments__7__RoleId: b3000000-0000-4000-8000-000000000210
      IdentitySeed__Assignments__7__CompanyId: 10000000-0000-0000-0000-000000000001
      IdentitySeed__Assignments__7__ValidFromUtc: "2026-01-01T00:00:00+00:00"
      IdentitySeed__Assignments__7__ApprovedByUserId: 20000000-0000-0000-0000-000000000003
      IdentitySeed__Assignments__7__Scopes__0__Type: Company
