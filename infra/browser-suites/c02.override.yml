# CARI-NORMAL (`browser:c02:ci`) — the synthetic actors of the create/reopen journey and of the SY-01/SY-02 read-only access view, and their
# Identity users, roles and company-wide assignments, seeded through the real IdentityDataSeeder at
# host start (before the canonical fixture baseline, so none of it appears as a delta).
#
# INDICES: Users 5, Roles 5, Assignments 7 — the same starting points every other suite override uses
# (measured across all eight). One override applies per run, so these are per-run positions rather
# than globally unique ones, and deviating would be the error, not the collision.
#
# THE TWO ACTORS DIFFER BY COMPANY, NOT BY PERMISSION, and that is the whole design:
#
#   c02-creator         counterparty.parties.create + counterparty.parties.read, company-wide in A
#   c02-other-company   THE SAME TWO NAMES, company-wide in B
#
# The edge this suite must show is the boundary of C-03's `SingleOrAuthorizedMultiCompanyRead`
# context, which is wider than the journey needs. An UNAUTHORIZED actor failing to open the record
# would have proved the permission fence and said nothing about the company fence — so the refusing
# actor is fully authorized and simply elsewhere. Holding the permissions constant is what makes
# company the only variable, and therefore the only possible explanation of the refusal.
#
# Both assignments are Company-scoped on their own company, as the suite contract requires of every
# suite assignment. (Why the contract requires that of every suite is an open question owned by the
# validator's owner and parked; nothing here depends on relaxing it, because both of these actors
# genuinely are company-wide.)
#
# NO FIXTURE AND NO SEED ENVELOPE: this suite creates the record it then reopens, so there is nothing
# to seed beyond the actors. It WRITES, and both registries say so — it is absent from
# READ_ONLY_SUITES and resolves on the workflow's writing arm.
#
# Every value is synthetic (SENTETIK browser-suite:c02 …) and exists only in the run's disposable
# database. Not a production grant, role or user.
services:
  api:
    environment:
      BootstrapIdentity__Users__2__UserId: c02-creator
      BootstrapIdentity__Users__2__DisplayName: SENTETIK browser-suite:c02 cari oluşturucu
      BootstrapIdentity__Users__3__UserId: c02-other-company
      BootstrapIdentity__Users__3__DisplayName: SENTETIK browser-suite:c02 diğer şirketin yetkili kullanıcısı
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-000000000401
      IdentitySeed__Users__5__DisplayName: SENTETIK browser-suite:c02 cari oluşturucu
      IdentitySeed__Users__5__ExternalIdentities__0__Id: b2100000-0000-4000-8000-000000000401
      IdentitySeed__Users__5__ExternalIdentities__0__Issuer: urn:goymen:development-bootstrap
      IdentitySeed__Users__5__ExternalIdentities__0__Subject: c02-creator
      IdentitySeed__Users__6__Id: b2000000-0000-4000-8000-000000000402
      IdentitySeed__Users__6__DisplayName: SENTETIK browser-suite:c02 diğer şirketin yetkili kullanıcısı
      IdentitySeed__Users__6__ExternalIdentities__0__Id: b2100000-0000-4000-8000-000000000402
      IdentitySeed__Users__6__ExternalIdentities__0__Issuer: urn:goymen:development-bootstrap
      IdentitySeed__Users__6__ExternalIdentities__0__Subject: c02-other-company
      # ONE role definition would have been enough for both actors, and it is deliberately TWO.
      # A shared role would make the two actors differ only by assignment, and a later edit to that
      # single role would silently change both sides of the comparison — including the refusing one,
      # which is the side whose authorization must stay maximal for C02-03 to mean anything.
      IdentitySeed__Roles__5__Id: b3000000-0000-4000-8000-000000000401
      IdentitySeed__Roles__5__Code: BROWSER_C02_CREATOR
      IdentitySeed__Roles__5__Name: SENTETIK browser-suite:c02 cari oluşturma ve okuma rolü
      IdentitySeed__Roles__5__IsSystem: "false"
      IdentitySeed__Roles__5__Permissions__0: counterparty.parties.create
      IdentitySeed__Roles__5__Permissions__1: counterparty.parties.read
      IdentitySeed__Roles__6__Id: b3000000-0000-4000-8000-000000000402
      IdentitySeed__Roles__6__Code: BROWSER_C02_OTHER_COMPANY
      IdentitySeed__Roles__6__Name: SENTETIK browser-suite:c02 diğer şirkette aynı yetkiler rolü
      IdentitySeed__Roles__6__IsSystem: "false"
      IdentitySeed__Roles__6__Permissions__0: counterparty.parties.create
      IdentitySeed__Roles__6__Permissions__1: counterparty.parties.read
      IdentitySeed__Assignments__7__Id: b4000000-0000-4000-8000-000000000401
      IdentitySeed__Assignments__7__UserId: b2000000-0000-4000-8000-000000000401
      IdentitySeed__Assignments__7__RoleId: b3000000-0000-4000-8000-000000000401
      IdentitySeed__Assignments__7__CompanyId: 10000000-0000-0000-0000-000000000001
      IdentitySeed__Assignments__7__ValidFromUtc: "2026-01-01T00:00:00+00:00"
      IdentitySeed__Assignments__7__ApprovedByUserId: 20000000-0000-0000-0000-000000000003
      IdentitySeed__Assignments__7__Scopes__0__Type: Company
      IdentitySeed__Assignments__7__Scopes__0__Id: 10000000-0000-0000-0000-000000000001
      # Company B, and this single differing pair of values is the entire experiment.
      IdentitySeed__Assignments__8__Id: b4000000-0000-4000-8000-000000000402
      IdentitySeed__Assignments__8__UserId: b2000000-0000-4000-8000-000000000402
      IdentitySeed__Assignments__8__RoleId: b3000000-0000-4000-8000-000000000402
      IdentitySeed__Assignments__8__CompanyId: 10000000-0000-0000-0000-000000000002
      IdentitySeed__Assignments__8__ValidFromUtc: "2026-01-01T00:00:00+00:00"
      IdentitySeed__Assignments__8__ApprovedByUserId: 20000000-0000-0000-0000-000000000003
      IdentitySeed__Assignments__8__Scopes__0__Type: Company
      IdentitySeed__Assignments__8__Scopes__0__Id: 10000000-0000-0000-0000-000000000002
      # SY-01/SY-02 read-only access view (user decision 2026-09-28): two administrators that hold ONLY
      # identity.assignments.read (Critical, company-wide only), one in A and one in B. The same design as above:
      # the permission is held constant and the company varies, so B's refusal of A's grants is the company fence.
      # No seeded or real role receives the name; these disposable actors are its only holders.
      BootstrapIdentity__Users__4__UserId: c02-access-admin
      BootstrapIdentity__Users__4__DisplayName: SENTETIK browser-suite:c02 yetki görüntüleyici
      BootstrapIdentity__Users__5__UserId: c02-access-admin-b
