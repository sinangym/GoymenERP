# R14 Inventory opening-stock acceptance and existing label/Product detail drill-down.
# Recorder has the existing opening, selector and label/balance permissions only; Product detail is
# derived from the gated disposable Product master Read assignment created by the R14 fixture.
# Denied retains only selector-read; arranger only Organization location-read. All are disposable GDC.
# The Product issuer has no role, assignment or sign-in actor. No production grant or policy changes.
# R19 split/merge (user decision 2026-09-27): the disposable r14-transformer is the ONLY holder of
# inventory.label-transformation.record, beside the label/balance reads of its label detail. No real user and
# no seeded role receives the name; the real-user mapping stays with persona #66/5802952566.
# AT-037 stock count (user decision 2026-09-27): the disposable r14-counter is the ONLY holder of
# inventory.stock-count.record and the disposable r14-count-approver the ONLY holder of inventory.stock-count.approve,
# each beside the label/balance reads of the label detail — two different actors (maker ≠ checker). No real user and
# no seeded role receives either name.
# ST-02 scrap write-off (the AT-037 pattern, maker ≠ checker for every scrap while the scrap approval authority is
# undecided): the disposable r14-scrapper is the ONLY holder of inventory.stock-scrap.record and the disposable
# r14-scrap-approver the ONLY holder of inventory.stock-scrap.approve, each beside the label/balance reads. No real
# user and no seeded role receives either name. r14 now has 8 suite actors (MAX_SUITE_ACTORS).
