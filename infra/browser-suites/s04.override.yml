# s04 (SİPARİŞ, SALES-A1 user-flow acceptance): the suite's closed-list API extensions on top of the
# `normal` profile, validated by tools/validate_browser_acceptance.py with the merged model
# (SUITE_API_EXTENSIONS["s04"]: Product issuer + actors + identity). The Product issuer is the existing
# u02 synthetic identity, rebound to this disposable suite without a role, assignment or sign-in actor; it
# enables Product's owned migrations/runtime before the gated host materializes one fixed candidate.
#  - Six suite actors appended to the canonical two BootstrapIdentity users (indices 2..7). The browser
#    suite signs in as each on the AUTHORIZED web (X-Development-User, the s03 way). The canonical users
#    hold no Sales permission and are not used by the suite.
#  - Each actor's Identity user, one role and one company-wide assignment in GDC through the real
#    IdentityDataSeeder (decision 1), continuing the built-in seed's indices (Users 5, Roles 5,
#    Assignments 7). The roles grant exactly the suite's closed list, split by persona (DEC-SAL-001, the
#    SALES-A1 card): the preparer creates and reads drafts, the approver approves and reads, the reader
#    only reads. The shell publishes the Sales list/detail to all three and the approve control (a control
#    of the detail, no route) to the approver only. SALES-A2a: the preparer also holds counterparty.parties.read
#    (the s03 precedent) so the create screen's customer picker and its delivery address / contact selects read
#    the Cari owner as that actor. Nothing else is granted, no system role is touched.
# Every value is synthetic (SENTETIK browser-suite:s04 …) and exists only in the run's disposable
# database. Not a production grant, role or user.
services:
  api:
    environment:
      ProductRuntime__IssuerLocalUserId: b2000000-0000-4000-8000-000000000201
      ProductRuntime__IssuerExternalIdentityId: b2100000-0000-4000-8000-000000000201
      BootstrapIdentity__Users__2__UserId: s04-preparer
      BootstrapIdentity__Users__2__DisplayName: SENTETIK browser-suite:s04 Sales preparer
      BootstrapIdentity__Users__3__UserId: s04-approver
      BootstrapIdentity__Users__3__DisplayName: SENTETIK browser-suite:s04 Sales approver
      BootstrapIdentity__Users__4__UserId: s04-reader
      BootstrapIdentity__Users__4__DisplayName: SENTETIK browser-suite:s04 Sales reader
      # ASSUMPTION-SALESA2A-1 (seed-only fixture actor, never a persona the browser signs in as): the s04 seed writes the
      # REAL customer's contact information through the real Cari command, which measures counterparty.parties.read AND
      # counterparty.parties.update.basic; no canonical actor holds update.basic (SYSTEM_ADMINISTRATOR: read/create/accounts
      # only) and widening the built-in seed is a production change. The write is the Cari owner's own command with the
      # owner's contract — an operational address and a contact person, no bank/tax/registry/price field. Disposable DB;
      # the real role composition stays the human grant gate.
      BootstrapIdentity__Users__5__UserId: s04-cari
      BootstrapIdentity__Users__5__DisplayName: SENTETIK browser-suite:s04 Cari fixture writer
      BootstrapIdentity__Users__6__UserId: s04-support-creator
      BootstrapIdentity__Users__6__DisplayName: SENTETIK browser-suite:s04 SalesSupport creator
      BootstrapIdentity__Users__7__UserId: s04-ordinary-creator
      BootstrapIdentity__Users__7__DisplayName: SENTETIK browser-suite:s04 ordinary creator
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-000000000401
      IdentitySeed__Users__5__DisplayName: SENTETIK browser-suite:s04 Sales preparer
      IdentitySeed__Users__5__ExternalIdentities__0__Id: b2100000-0000-4000-8000-000000000401
      IdentitySeed__Users__5__ExternalIdentities__0__Issuer: urn:goymen:development-bootstrap
      IdentitySeed__Users__5__ExternalIdentities__0__Subject: s04-preparer
