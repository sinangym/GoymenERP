# MFG (`browser:mfg`) — the suite's closed-list API extension (BROWSER-CI stage 2, a2 part 2).
#
# Owner: ORGANİZASYON (Manufacturing owner; suite owner). Validated with the merged model by
# tools/validate_browser_acceptance.py once the central writer registers the `mfg` suite
# (SUITES / SUITE_PROFILES `normal` since MFG-UI-F, first `mfg-staged`; SUITE_API_EXTENSIONS["mfg"] = Product issuer +
# actors + identity, SUITE_IDENTITY_PERMISSIONS["mfg"] = the closed names below). The Product issuer is the existing
# disposable u02 identity rebound to this suite without an actor, role, assignment or grant; it enables the Product
# runtime and the gated fixed candidate used by Inventory's real opening-count command.
#
# Three synthetic actors after the canonical two, each with its Identity user, a synthetic role and a
# company-wide assignment in GDC (the company whose approved kilogram profile the real Settings
# provider answers). Company-wide because MFG-API requires a company-wide grant (K-1). Disposable test
# database only: no production user, role or permission.
#   mfg-recorder: the Manufacturing writes/reads plus the exact Organization, Inventory and Product reads/command
#                 required by the real plan-create screen and its real opening-stock parent-roll fixture
#   mfg-reader:   orders.read (sees the balances, no form: card D3)
#   mfg-closer:   orders.read + orders.close + the disposable reasoned exception approval authority
