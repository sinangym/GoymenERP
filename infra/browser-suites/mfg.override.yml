# MFG (`browser:mfg`) — the suite's closed-list API extension (BROWSER-CI stage 2, a2 part 2).
#
# Owner: ORGANİZASYON (Manufacturing owner; suite owner). Validated with the merged model by
# tools/validate_browser_acceptance.py once the central writer registers the `mfg` suite
# (SUITES / SUITE_PROFILES `mfg-staged`, SUITE_API_EXTENSIONS["mfg"] = actors + identity,
# SUITE_IDENTITY_PERMISSIONS["mfg"] = the five Manufacturing names below).
#
# Two synthetic actors after the canonical two, each with its Identity user, a synthetic role and a
# company-wide assignment in GDC (the company whose approved kilogram profile the real Settings
# provider answers). Company-wide because MFG-API requires a company-wide grant (K-1). Disposable test
# database only: no production user, role or permission.
#   mfg-recorder: plans.write, plans.approve, orders.create, facts.record, orders.read
#   mfg-reader:   orders.read (sees the balances, no form: card D3)
services:
  api:
    environment:
      BootstrapIdentity__Users__2__UserId: mfg-recorder
      BootstrapIdentity__Users__2__DisplayName: SENTETIK MFG Recorder
      BootstrapIdentity__Users__3__UserId: mfg-reader
      BootstrapIdentity__Users__3__DisplayName: SENTETIK MFG Reader
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-00000000f001
