# s03 (SİPARİŞ): the suite's closed-list API extensions on top of the `normal` profile, validated by
# tools/validate_browser_acceptance.py with the merged model (SUITE_API_EXTENSIONS["s03"]: actors +
# identity; the Product issuer binding is allowed but not needed by v2a, so it is not set).
#  - One suite actor, `s03-sales-clerk`, appended to the canonical two BootstrapIdentity users (index 2).
#    The browser suite signs in as it on the AUTHORIZED web (X-Development-User); the unauthorized web
#    keeps its canonical `company-a-user`, which holds no Sales permission (V2A-03).
#  - Its Identity user, one role and one company-wide assignment through the real IdentityDataSeeder
#    (decision 1), continuing the built-in seed's indices (Users 5, Roles 5, Assignments 7). The role
#    grants exactly the suite's closed list: sales.drafts.create, sales.drafts.read and
#    product.operational-selection.read — the disposable grant the s03 spec's preconditions name. The
#    shell publishes sales.drafts.list/detail (read) and sales.drafts.create (create) to this actor in
#    GDC; nothing else is granted, no system role is touched.
# Every value is synthetic (SENTETIK browser-suite:s03 …) and exists only in the run's disposable
# database. Not a production grant, role or user.
services:
  api:
    environment:
      BootstrapIdentity__Users__2__UserId: s03-sales-clerk
      BootstrapIdentity__Users__2__DisplayName: SENTETIK browser-suite:s03 Sales clerk
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-000000000301
      IdentitySeed__Users__5__DisplayName: SENTETIK browser-suite:s03 Sales clerk
      IdentitySeed__Users__5__ExternalIdentities__0__Id: b2100000-0000-4000-8000-000000000301
      IdentitySeed__Users__5__ExternalIdentities__0__Issuer: urn:goymen:development-bootstrap
      IdentitySeed__Users__5__ExternalIdentities__0__Subject: s03-sales-clerk
      IdentitySeed__Roles__5__Id: b3000000-0000-4000-8000-000000000301
      IdentitySeed__Roles__5__Code: BROWSER_S03_SALES_CLERK
      IdentitySeed__Roles__5__Name: SENTETIK browser-suite:s03 satış sipariş taslağı rolü
      IdentitySeed__Roles__5__IsSystem: "false"
      IdentitySeed__Roles__5__Permissions__0: sales.drafts.create
      IdentitySeed__Roles__5__Permissions__1: sales.drafts.read
      IdentitySeed__Roles__5__Permissions__2: product.operational-selection.read
      IdentitySeed__Assignments__7__Id: b4000000-0000-4000-8000-000000000301
      IdentitySeed__Assignments__7__UserId: b2000000-0000-4000-8000-000000000301
      IdentitySeed__Assignments__7__RoleId: b3000000-0000-4000-8000-000000000301
      IdentitySeed__Assignments__7__CompanyId: 10000000-0000-0000-0000-000000000001
      IdentitySeed__Assignments__7__ValidFromUtc: "2026-01-01T00:00:00+00:00"
      IdentitySeed__Assignments__7__ApprovedByUserId: 20000000-0000-0000-0000-000000000003
      IdentitySeed__Assignments__7__Scopes__0__Type: Company
      IdentitySeed__Assignments__7__Scopes__0__Id: 10000000-0000-0000-0000-000000000001
