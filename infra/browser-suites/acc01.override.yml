# ACC-01 (`browser:acc01`) — the suite's closed-list API extension (BROWSER-CI stage 2).
#
# Owner: FİNANS (Accounting owner; suite owner). Validated with the merged model by
# tools/validate_browser_acceptance.py once the central writer registers the `acc01` suite
# (SUITES / normal profile, actors + identity, and the closed permission tuple below).
#
# Two synthetic actors after the canonical two, each with its Identity user, synthetic roles and
# company-wide assignments. Company-wide because every Accounting name is CompanyWideOnly. Disposable
# test database only: no production user, role or permission.
#   acc01-preparer (GDC): proposes periods and reads the journals and queues —
#                   Accounting period/journal/queue names, Finance source reads and normal-draft create/approve.
#                   It holds both approve names ON PURPOSE: each owner still enforces its own transition rules.
#                   proposal although it holds the grant.
#   acc01-preparer (GSP): accounting.periods.read only — company B, to show GDC's periods never appear there.
#   acc01-approver (GDC): approves another person's proposal (Ö4) and closes (Ö5) —
#                   accounting.periods.read / .approve / .close. No journal or queue name: those routes stay
#                   closed to it.
services:
  api:
    environment:
      BrowserSuiteApi__Profile: acc01
      BrowserSuiteApi__Disposable: CONFIRMED
      BrowserSuiteApi__TestedCommit: ${C01_E2E_TESTED_COMMIT:?C01_E2E_TESTED_COMMIT must be set}
      BrowserSuiteApi__RunId: ${GOYMEN_ERP_C01_E2E_RUN_ID:?GOYMEN_ERP_C01_E2E_RUN_ID must be set}
      BrowserSuiteApi__ComposeProject: ${GOYMEN_ERP_C01_E2E_COMPOSE_PROJECT:?GOYMEN_ERP_C01_E2E_COMPOSE_PROJECT must be set}
      BootstrapIdentity__Users__2__UserId: acc01-preparer
      BootstrapIdentity__Users__2__DisplayName: SENTETIK ACC01 Preparer
      BootstrapIdentity__Users__3__UserId: acc01-approver
      BootstrapIdentity__Users__3__DisplayName: SENTETIK ACC01 Approver
      IdentitySeed__Users__5__Id: b2000000-0000-4000-8000-00000000ac01
      IdentitySeed__Users__5__DisplayName: SENTETIK ACC01 Preparer
      IdentitySeed__Users__5__ExternalIdentities__0__Id: b2100000-0000-4000-8000-00000000ac01
