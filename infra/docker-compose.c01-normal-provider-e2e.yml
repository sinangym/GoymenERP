services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
    ports:
      - target: 1433
        published: ${C01_NORMAL_SQL_PORT:-12433}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - c01-normal-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    labels:
      com.goymen.e2e.suite: C01-NORMAL-PROVIDER-ATTESTATION-V1
      com.goymen.e2e.tested-commit: ${C01_NORMAL_TESTED_COMMIT:?C01_NORMAL_TESTED_COMMIT must be set}

  api:
    build:
      context: ..
      dockerfile: src/backend/GoymenERP.Api/Dockerfile
      labels:
        org.opencontainers.image.revision: ${C01_NORMAL_TESTED_COMMIT:?C01_NORMAL_TESTED_COMMIT must be set}
        com.goymen.e2e.suite: C01-NORMAL-PROVIDER-ATTESTATION-V1
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      DB_PROVIDER: SqlServer
      DB_CONNECTION_STRING: Server=sqlserver,1433;Database=${C01_NORMAL_DATABASE_NAME:?C01_NORMAL_DATABASE_NAME must be set};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Counterparty__CursorSigningKey: ${C01_NORMAL_CURSOR_SIGNING_KEY:?C01_NORMAL_CURSOR_SIGNING_KEY must be set}
      NormalProviderAttestation__OutputPath: /run/goymen-attestation/runtime.json
      BootstrapIdentity__HeaderName: X-Development-User
      BootstrapIdentity__Users__0__UserId: group-bootstrap-admin
      BootstrapIdentity__Users__0__DisplayName: C01 Normal Provider Administrator
    ports:
      - target: 8080
        published: ${C01_NORMAL_API_PORT:-16080}
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /run/goymen-attestation:mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/goymen-attestation/runtime.json && grep -q ':1F90 ' /proc/net/tcp /proc/net/tcp6
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      sqlserver:
        condition: service_healthy
    labels:
      com.goymen.e2e.suite: C01-NORMAL-PROVIDER-ATTESTATION-V1
      com.goymen.e2e.tested-commit: ${C01_NORMAL_TESTED_COMMIT:?C01_NORMAL_TESTED_COMMIT must be set}

volumes:
  c01-normal-sqlserver-data:
    labels:
      com.goymen.e2e.suite: C01-NORMAL-PROVIDER-ATTESTATION-V1
      com.goymen.e2e.tested-commit: ${C01_NORMAL_TESTED_COMMIT:?C01_NORMAL_TESTED_COMMIT must be set}
