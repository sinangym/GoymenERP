name: Cari C006 backend envelope acceptance

on:
  # CIH-D5: prose that no CI job reads does not start this workflow. Only *.md files in four
  # folders are ignored; the Markdown files a validator reads are re-included by name. The last
  # matching pattern decides, and both events carry the same list. Pinned by
  # tests/ci_safe_trx_summary/test_workflow_path_filters.py.
  pull_request:
    paths:
      - '**'
      - '!docs/decisions/**/*.md'
      - 'docs/decisions/KARAR_SICILI.md'
      - 'docs/decisions/ACIK_KARARLAR.md'
      - 'docs/decisions/SINAN_KARARLARI_2026-08-31.md'
      - '!docs/delivery/**/*.md'
      - 'docs/delivery/DECISION_PACK.md'
      - '!docs/handoffs/**/*.md'
      - '!docs/operations/**/*.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/decisions/**/*.md'
      - 'docs/decisions/KARAR_SICILI.md'
      - 'docs/decisions/ACIK_KARARLAR.md'
      - 'docs/decisions/SINAN_KARARLARI_2026-08-31.md'
      - '!docs/delivery/**/*.md'
      - 'docs/delivery/DECISION_PACK.md'
      - '!docs/handoffs/**/*.md'
      - '!docs/operations/**/*.md'

permissions:
  contents: read

# CIH-D6: a newer push to a pull request replaces its older run. Every main run has its own group,
# so a main run is never cancelled or replaced while it waits.
concurrency:
  group: cari-c006-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cari-c006-backend:
    name: Cari C006 backend envelope
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Existing frontend-owned scanner at an immutable source, not browser PASS evidence.
      - uses: actions/checkout@v7
        with:
          ref: c3cb45e1f85a7079c742bc0abbe62ca3aa805dfe
          path: artifacts/c006-frontend-scanner
          persist-credentials: false
          sparse-checkout: tests/e2e/cari-acceptance-009
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify backend source and lifecycle
        run: >-
          ./tools/ci/cari-c02-link.ps1 -Mode BackendVerify
          -OutputParent "${{ runner.temp }}/cari-c006-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Scan final evidence before uploading
        id: scan
        if: always()
        run: >-
          node artifacts/c006-frontend-scanner/tests/e2e/cari-acceptance-009/scan-evidence.mjs
          "${{ runner.temp }}/cari-c006-${{ github.run_id }}-${{ github.run_attempt }}/scan.json"
          "${{ runner.temp }}/cari-c006-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve scanned results, including failed runs
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: cari-c006-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cari-c006-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
