name: Temporary repository seed import

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  import-seed:
    if: github.event.issue.title == 'GOYMEN_SEED_IMPORT_V1' && contains(github.event.comment.body, 'GOYMEN_SEED_FINAL')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and import repository seed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_ZIP_SHA256: 46222303286d28f19a99a6dfaf8ef16c16c89c9c0e8dc603a280450d3a311b57
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess, tempfile, urllib.request, zipfile

          repo = os.environ['GH_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          expected_sha = os.environ['EXPECTED_ZIP_SHA256']

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req) as r:
              comments = json.load(r)

          chunks = {}
          for c in comments:
              body = c.get('body') or ''
              m = re.match(r'^GOYMEN_SEED_CHUNK\s+(\d{2})/07\n([A-Za-z0-9+/=]+)(?:\nGOYMEN_SEED_FINAL)?\s*$', body)
              if m:
                  chunks[int(m.group(1))] = m.group(2)

          expected_indexes = list(range(8))
          if sorted(chunks) != expected_indexes:
              raise SystemExit(f'Chunk set incomplete: got {sorted(chunks)}, expected {expected_indexes}')

          raw = base64.b64decode(''.join(chunks[i] for i in expected_indexes), validate=True)
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'ZIP checksum mismatch: {actual_sha}')

          work = tempfile.mkdtemp(prefix='goymen-seed-')
          zpath = os.path.join(work, 'seed.zip')
          with open(zpath, 'wb') as f:
              f.write(raw)
          extract = os.path.join(work, 'extract')
          with zipfile.ZipFile(zpath) as z:
              z.extractall(extract)

          matches = []
          for root, dirs, files in os.walk(extract):
              if os.path.basename(root) == '15_REPO_SEED':
                  matches.append(root)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one 15_REPO_SEED, got {matches}')
          seed = matches[0]

          seed_files = []
          for root, dirs, files in os.walk(seed):
              for name in files:
                  seed_files.append(os.path.relpath(os.path.join(root, name), seed).replace(os.sep, '/'))
          seed_files.sort()
          if len(seed_files) != 40:
              raise SystemExit(f'Expected 40 seed files, got {len(seed_files)}')

          root = os.getcwd()
          for name in os.listdir(root):
              if name == '.git':
                  continue
              p = os.path.join(root, name)
              if os.path.isdir(p) and not os.path.islink(p):
                  shutil.rmtree(p)
              else:
                  os.remove(p)

          for name in os.listdir(seed):
              src = os.path.join(seed, name)
              dst = os.path.join(root, name)
              if os.path.isdir(src):
                  shutil.copytree(src, dst)
              else:
                  shutil.copy2(src, dst)

          actual_files = []
          for r, dirs, files in os.walk(root):
              if '.git' in dirs:
                  dirs.remove('.git')
              for name in files:
                  actual_files.append(os.path.relpath(os.path.join(r, name), root).replace(os.sep, '/'))
          actual_files.sort()
          if actual_files != seed_files:
              missing = sorted(set(seed_files)-set(actual_files))
              extra = sorted(set(actual_files)-set(seed_files))
              raise SystemExit(f'Repository tree mismatch. missing={missing}, extra={extra}')

          subprocess.run(['git','config','user.name','Göymen ERP Seed Import'], check=True)
          subprocess.run(['git','config','user.email','actions@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','Import complete Göymen ERP repository seed v1.0'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
          print('Imported 40/40 repository seed files successfully.')
          PY
