name: Temporary repository seed import

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  import-seed:
    if: github.event.issue.title == 'GOYMEN_SEED_IMPORT_V1' && contains(github.event.comment.body, 'GOYMEN_SEED_XZ2_FINAL')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify, and import repository seed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_ARCHIVE_SHA256: 23915e0a988fa40c83910541f806379858a63f19034166dead5beac6f25f2fb0
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import urllib.request

          repo = os.environ['GH_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          expected_archive_sha = os.environ['EXPECTED_ARCHIVE_SHA256']

          expected_chunk_sha = {
              0: 'bd333f9425d2e31c95d23c455dc57b500c0d92fa9fb7c750f54a510b9d66a47b',
              1: '412dce7eaebdd21e95c02b80e83b2e5dcb46e512a224e393a89751b4cb4cf59a',
              2: 'b66683f98848757772acc66533d4833f9f281587187f6e217d13549de4adc389',
              3: '400fd33e9c0929a4a17fe06723ac50855950e8eba366f914df9f1850d537f119',
              4: 'c755c985536b509b7a754fac4fe9d37ca9b0ba36c5274cc9f7b42057e128d7c3',
              5: '4560fd3929f2d5851b1040dd5e83897d1c8e859701d583cced46cb6927854c81',
              6: 'c6eff5c0ad0826df8df6d31f405fd570fa8970f1961d5b43c5cf73d10a5b4691',
          }
          expected_chunk2_part_sha = {
              0: 'f7ef1a7f758d8d1241e01d42af843cf7ba3b471cca0ba6d3cd3dfcf58d983e48',
              1: '7e81acf675f3e586aa17b7599600f8d1b732a50da9744f44f5bd84f1d64e3bde',
              2: '4a190cd6adbb740aca1298338a46b1883a3f2421baffdc551a6a06fc03451421',
              3: '580982117aca94e6b20b17cfb927b38e355f7df9b4811cb616ba23bb991e444e',
          }
          expected_part0_sub_sha = {
              0: '3ad99b6488ed7051c1339bebb063cfd43861abdb949328774c4c7444b4d691c8',
              1: 'ff074182e9acb712d831051ecd2362836104a40c07cee6389ed06893c0ac383e',
              2: 'bd7f089f0be80f59f4fa78530e25852bf9cd2fede2abf5569ba3017ced676503',
          }

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          chunks = {}
          chunk2_parts = {}
          part0_subs = {}
          candidates = {}

          for item in comments:
              body = item.get('body') or ''

              match = re.match(
                  r'^GOYMEN_SEED_XZ2_CHUNK\s+(\d{2})/06\n([A-Za-z0-9+/=]+)\s*$',
                  body,
              )
              if match:
                  index = int(match.group(1))
                  payload = match.group(2)
                  digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
                  candidates.setdefault(f'chunk-{index}', []).append((len(payload), digest))
                  if expected_chunk_sha.get(index) == digest:
                      chunks[index] = payload
                  continue

              part_match = re.match(
                  r'^GOYMEN_SEED_XZ2_CHUNK2_PART\s+(\d)/03\n([A-Za-z0-9+/=]+)\s*$',
                  body,
              )
              if part_match:
                  part_index = int(part_match.group(1))
                  payload = part_match.group(2)
                  digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
                  candidates.setdefault(f'chunk-2-part-{part_index}', []).append((len(payload), digest))
                  if expected_chunk2_part_sha.get(part_index) == digest:
                      chunk2_parts[part_index] = payload
                  continue

              sub_match = re.match(
                  r'^GOYMEN_SEED_XZ2_CHUNK2_PART0_SUB\s+(\d)/02\n([A-Za-z0-9+/=]+)\s*$',
                  body,
              )
              if sub_match:
                  sub_index = int(sub_match.group(1))
                  payload = sub_match.group(2)
                  digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
                  candidates.setdefault(f'chunk-2-part-0-sub-{sub_index}', []).append((len(payload), digest))
                  if expected_part0_sub_sha.get(sub_index) == digest:
                      part0_subs[sub_index] = payload

          if 0 not in chunk2_parts and sorted(part0_subs) == [0, 1, 2]:
              rebuilt_part0 = ''.join(part0_subs[index] for index in range(3))
              rebuilt_part0_digest = hashlib.sha256(rebuilt_part0.encode('ascii')).hexdigest()
              if rebuilt_part0_digest != expected_chunk2_part_sha[0]:
                  raise SystemExit(f'Rebuilt chunk 2 part 0 checksum mismatch: {rebuilt_part0_digest}')
              chunk2_parts[0] = rebuilt_part0

          if 2 not in chunks and sorted(chunk2_parts) == [0, 1, 2, 3]:
              rebuilt_chunk2 = ''.join(chunk2_parts[index] for index in range(4))
              rebuilt_digest = hashlib.sha256(rebuilt_chunk2.encode('ascii')).hexdigest()
              if rebuilt_digest != expected_chunk_sha[2]:
                  raise SystemExit(f'Rebuilt chunk 2 checksum mismatch: {rebuilt_digest}')
              chunks[2] = rebuilt_chunk2

          expected_indexes = list(range(7))
          if sorted(chunks) != expected_indexes:
              raise SystemExit(
                  f'No verified complete chunk set. verified={sorted(chunks)}, '
                  f'chunk2_parts={sorted(chunk2_parts)}, part0_subs={sorted(part0_subs)}, '
                  f'candidates={candidates}'
              )

          archive_bytes = base64.b64decode(
              ''.join(chunks[index] for index in expected_indexes),
              validate=True,
          )
          actual_archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive_sha != expected_archive_sha:
              raise SystemExit(f'Archive checksum mismatch: {actual_archive_sha}')

          work = tempfile.mkdtemp(prefix='goymen-seed-')
          archive_path = os.path.join(work, 'seed.tar.xz')
          with open(archive_path, 'wb') as handle:
              handle.write(archive_bytes)

          extract_root = os.path.join(work, 'extract')
          os.makedirs(extract_root)
          with tarfile.open(archive_path, mode='r:xz') as archive:
              destination = os.path.realpath(extract_root)
              for member in archive.getmembers():
                  target = os.path.realpath(os.path.join(extract_root, member.name))
                  if target != destination and not target.startswith(destination + os.sep):
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              archive.extractall(extract_root)

          seed = os.path.join(extract_root, '15_REPO_SEED')
          if not os.path.isdir(seed):
              raise SystemExit('15_REPO_SEED directory was not found')

          seed_files = []
          for current_root, _, files in os.walk(seed):
              for name in files:
                  seed_files.append(
                      os.path.relpath(os.path.join(current_root, name), seed).replace(os.sep, '/')
                  )
          seed_files.sort()
          if len(seed_files) != 40:
              raise SystemExit(f'Expected 40 seed files, got {len(seed_files)}')

          repository_root = os.getcwd()
          for name in os.listdir(repository_root):
              if name == '.git':
                  continue
              path = os.path.join(repository_root, name)
              if os.path.isdir(path) and not os.path.islink(path):
                  shutil.rmtree(path)
              else:
                  os.remove(path)

          for name in os.listdir(seed):
              source = os.path.join(seed, name)
              target = os.path.join(repository_root, name)
              if os.path.isdir(source):
                  shutil.copytree(source, target)
              else:
                  shutil.copy2(source, target)

          actual_files = []
          for current_root, dirs, files in os.walk(repository_root):
              if '.git' in dirs:
                  dirs.remove('.git')
              for name in files:
                  actual_files.append(
                      os.path.relpath(os.path.join(current_root, name), repository_root).replace(os.sep, '/')
                  )
          actual_files.sort()
          if actual_files != seed_files:
              missing = sorted(set(seed_files) - set(actual_files))
              extra = sorted(set(actual_files) - set(seed_files))
              raise SystemExit(f'Repository tree mismatch. missing={missing}, extra={extra}')

          subprocess.run(['git', 'config', 'user.name', 'Göymen ERP Seed Import'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'actions@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Import complete Göymen ERP repository seed v1.0'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          print('Imported and verified 40/40 repository seed files successfully.')
          PY
