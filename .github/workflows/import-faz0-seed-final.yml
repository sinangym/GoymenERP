name: Import Exact Faz 0 Seed

on:
  push:
    paths:
      - .github/workflows/import-faz0-seed-final.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SEED_PASSPHRASE: GEF0-7bb6d4d1-29b8-4e1c-b50e-9acaf7b19b4e

jobs:
  import-exact-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified encrypted package
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://goymen-erp-seed-260827d.loca.lt/seed.enc"
            "https://goymen-erp-seed-260827e.loca.lt/seed.enc"
            "https://goymen-erp-seed-260827f.loca.lt/seed.enc"
            "https://goymen-erp-seed-260827g.loca.lt/seed.enc"
            "http://bore.pub:45131/seed.enc"
            "http://bore.pub:45137/seed.enc"
            "http://bore.pub:45141/seed.enc"
            "http://bore.pub:45143/seed.enc"
            "http://bore.pub:45147/seed.enc"
          )
          success=0
          for url in "${urls[@]}"; do
            echo "Trying ${url}"
            rm -f /tmp/seed.enc /tmp/faz0.zip
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 10 --max-time 150 \
              -H "bypass-tunnel-reminder: true" "$url" -o /tmp/seed.enc || continue
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in /tmp/seed.enc -out /tmp/faz0.zip \
              -pass "pass:${SEED_PASSPHRASE}" >/dev/null 2>&1 || continue
            unzip -tq /tmp/faz0.zip >/dev/null || continue
            success=1
            break
          done
          test "$success" = 1

      - name: Replace repository with the exact 15_REPO_SEED tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/faz0 && mkdir -p /tmp/faz0
          unzip -q /tmp/faz0.zip -d /tmp/faz0
          seed_dir="$(find /tmp/faz0 -type d -name '15_REPO_SEED' -print -quit)"
          test -n "$seed_dir"
          source_count="$(find "$seed_dir" -type f | wc -l | tr -d ' ')"
          test "$source_count" = 40

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$seed_dir"/. .

          target_count="$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')"
          test "$target_count" = 40
          test -f AGENTS.md
          test -f README.md
          test -d docs

      - name: Commit and push exact seed
        id: seed_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sinan Göymen"
          git config user.email "235009049+sinangym@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Seed repository from Faz 0 package v1.0"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report completion to temporary verifier
        if: always()
        shell: bash
        run: |
          sha='${{ steps.seed_commit.outputs.sha }}'
          for base in \
            'https://goymen-erp-seed-260827d.loca.lt' \
            'https://goymen-erp-seed-260827e.loca.lt' \
            'https://goymen-erp-seed-260827f.loca.lt' \
            'https://goymen-erp-seed-260827g.loca.lt'; do
            curl -sS --max-time 10 -H 'bypass-tunnel-reminder: true' \
              "${base}/COMPLETE_${sha}" >/dev/null || true
          done
