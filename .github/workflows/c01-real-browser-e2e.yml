name: C-01 real-browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c01-real-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c01-real-browser-e2e:
    name: C-01 real-browser E2E
    runs-on: [self-hosted, Linux, X64, goymen-ci-isolated]
    timeout-minutes: 60
    env:
      C01_E2E_COMPOSE_FILE: infra/docker-compose.c01-e2e.yml
      C01_E2E_SQL_PORT: "11433"
      C01_E2E_API_PORT: "15080"
      C01_E2E_AUTHORIZED_WEB_PORT: "15173"
      C01_E2E_UNAUTHORIZED_WEB_PORT: "15174"
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and disposable run secrets
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

          compose_project="goymen-c01-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database_name="GoymenErpC01_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sql_password="C01_$(openssl rand -hex 20)_Aa1!"
          cursor_key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$cursor_key"
          {
            echo "C01_E2E_TESTED_COMMIT=$actual_head"
            echo "C01_E2E_COMPOSE_PROJECT=$compose_project"
            echo "C01_E2E_DATABASE_NAME=$database_name"
            echo "COMPOSE_PROJECT_NAME=$compose_project"
            echo "MSSQL_SA_PASSWORD=$sql_password"
            echo "C01_E2E_CURSOR_SIGNING_KEY=$cursor_key"
            echo "GOYMEN_ERP_C01_E2E_SQLSERVER_CONNECTION=Server=127.0.0.1,${C01_E2E_SQL_PORT};Database=${database_name};User Id=sa;Password=${sql_password};Encrypt=True;TrustServerCertificate=True"
            echo "GOYMEN_ERP_C01_E2E_DISPOSABLE=CONFIRMED"
            echo "GOYMEN_ERP_C01_E2E_TESTED_COMMIT=$actual_head"
            echo "GOYMEN_ERP_C01_E2E_RUN_ID=$GITHUB_RUN_ID"
            echo "GOYMEN_ERP_C01_E2E_COMPOSE_PROJECT=$compose_project"
            echo "GOYMEN_ERP_C01_E2E_FIXTURE_EVIDENCE=$GITHUB_WORKSPACE/artifacts/c01-e2e-fixture-evidence.json"
          } >> "$GITHUB_ENV"
          mkdir -p artifacts/container-logs

      - name: Require complete SAB source and runner contract
        id: sab_gate
        run: |
          python3 -I -S -B tools/validate_sab_e2e_contract.py preflight \
            --repository-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate E2E contract tooling
        run: |
          python3 -I -S -B -m unittest discover \
            -s tests/dockerhub_mirror_contract \
            -p "test_*.py" \
            -v
          python3 -I -S -B -m unittest discover \
            -s tests/c01_e2e_contract \
            -p "test_*.py" \
            -v
          python3 -I -S -B -m unittest discover \
            -s tests/sab_e2e_contract \
            -p "test_*.py" \
            -v

      - name: Configure Docker Hub cache mirror
        run: |
          sudo python3 -I -S -B tools/configure_dockerhub_mirror.py configure \
            --daemon-config /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | \
            python3 -I -S -B tools/configure_dockerhub_mirror.py verify

      - name: Validate loopback-only compose model
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" \
            config --format json \
            | python3 -I -S -B tools/validate_c01_e2e_contract.py compose \
                --input - \
                --expected-commit "$C01_E2E_TESTED_COMMIT" \
                --expected-project "$C01_E2E_COMPOSE_PROJECT"

      - name: Restore fixture materializer
        run: |
          dotnet restore \
            tests/GoymenERP.C01E2eFixtureTool/GoymenERP.C01E2eFixtureTool.csproj \
            -noAutoResponse \
            --configfile NuGet.Config

      - name: Build and start disposable SQL/API
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" \
            up -d --build sqlserver api
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${C01_E2E_API_PORT}/health/live" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ps --all
          # Diagnostics stay in the masked job log; runtime logs are never uploaded as artifacts.
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" logs --no-color --tail 80 api || true
          exit 1

      - name: Materialize and verify canonical C-01 fixture
        run: |
          dotnet run \
            --project tests/GoymenERP.C01E2eFixtureTool/GoymenERP.C01E2eFixtureTool.csproj \
            --configuration Release \
            --no-restore \
            -- materialize

      - name: Verify real capability/API/SQL preflight
        run: |
          python3 -I -S -B tools/verify_c01_e2e_api.py \
            --base-url "http://127.0.0.1:${C01_E2E_API_PORT}" \
            --tested-commit "$C01_E2E_TESTED_COMMIT" \
            --output artifacts/c01-e2e-api-preflight.json

      - name: Build and start authorized and unauthorized web profiles
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" \
            build web-authorized web-unauthorized
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" \
            up -d --no-build --no-deps web-authorized web-unauthorized
          curl --fail --silent --show-error \
            "http://127.0.0.1:${C01_E2E_API_PORT}/health/live" >/dev/null
          for port in "$C01_E2E_AUTHORIZED_WEB_PORT" "$C01_E2E_UNAUTHORIZED_WEB_PORT"; do
            ready=false
            for attempt in $(seq 1 90); do
              if curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done

      - name: Require Claude-owned browser suite
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/e2e/package.json || {
            echo "::error::C01_BROWSER_SUITE_MISSING: tests/e2e/package.json";
            exit 1;
          }
          test -f tests/e2e/package-lock.json || {
            echo "::error::C01_BROWSER_LOCKFILE_MISSING: tests/e2e/package-lock.json";
            exit 1;
          }

      - name: Install pinned browser runner
        working-directory: tests/e2e
        run: |
          npm ci
          npm audit --audit-level=high
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run B-C01-001 through B-C01-010
        working-directory: tests/e2e
        env:
          C01_E2E_AUTHORIZED_BASE_URL: http://127.0.0.1:15173
          C01_E2E_UNAUTHORIZED_BASE_URL: http://127.0.0.1:15174
          C01_E2E_API_BASE_URL: http://127.0.0.1:15080
          C01_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: |
          curl --fail --silent --show-error \
            "$C01_E2E_API_BASE_URL/health/live" >/dev/null
          npm run c01:ci

      - name: Run SHELL-AUTH-BOUNDARY browser acceptance
        # Narrow extension, same disposable stack, same runner. Issue #165 requires
        # route/focus/refetch and stale-response acceptance in a real browser;
        # committed-but-unexecuted tests are not proof of it (Codex, #169 P1-3).
        #
        # The authorized web profile above is built from the PR's own source, so
        # this exercises the shell under review rather than whatever is on main.
        #
        # Separate config and separate JUnit on purpose: the C-01 evidence contract
        # requires exactly ten B-C01 testcases, so these must not join that report.
        if: steps.sab_gate.outputs.enabled == 'true'
        working-directory: tests/e2e
        env:
          SAB_E2E_BASE_URL: http://127.0.0.1:15173
          SAB_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/artifacts/sab-junit.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/artifacts/sab-html-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run sab:ci -- --reporter=list,junit,html

      - name: Require exact clean SAB evidence
        if: steps.sab_gate.outputs.enabled == 'true'
        run: |
          python3 -I -S -B tools/validate_sab_e2e_contract.py evidence \
            --junit artifacts/sab-junit.xml \
            --html artifacts/sab-html-report/index.html

      - name: Validate browser and network evidence
        run: |
          python3 -I -S -B tools/validate_c01_e2e_contract.py evidence \
            --evidence artifacts/c01-e2e-evidence.json \
            --network artifacts/c01-e2e-network-summary.json \
            --junit artifacts/c01-e2e-junit.xml \
            --html artifacts/c01-e2e-html-report/index.html \
            --expected-commit "$C01_E2E_TESTED_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-project "$C01_E2E_COMPOSE_PROJECT"

      - name: Require the activation history/revoke suite
        id: activation_gate
        run: |
          set -euo pipefail
          enabled=true
          test -f tests/e2e/playwright.activation.config.ts || enabled=false
          test -f tests/e2e/activation/historyRevoke.spec.ts || enabled=false
          test -f tests/e2e/activation/revokeGrant.ts || enabled=false
          if [ "$enabled" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run C-01A activation history/revoke evidence
        # Placed HERE, between the C-01/SAB evidence validation and the read-only
        # verification, and that ordering is the point:
        #
        #   - C-01 and SAB are validated first, on a database nothing has touched;
        #   - this case then revokes a grant and restores it;
        #   - the read-only verification that follows therefore also proves the
        #     mutation left no residue.
        #
        # Codex asked for a DEDICATED workflow (#196 P1-3). This is a deliberate
        # deviation: a separate workflow would duplicate ~200 lines of disposable
        # stack setup, giving two places to drift, and it would run the activation
        # case under a different run identity than the C-01/SAB evidence #184
        # requires it to share. Sharing the job makes the identity one thing and
        # gets the residue check for free. Saying so rather than quietly choosing.
        if: steps.activation_gate.outputs.enabled == 'true'
        working-directory: tests/e2e
        env:
          ACTIVATION_E2E_BASE_URL: http://127.0.0.1:15173
          ACTIVATION_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          ACTIVATION_E2E_DATABASE: ${{ env.C01_E2E_DATABASE_NAME }}
          ACTIVATION_E2E_ACTOR: group-bootstrap-admin
          ACTIVATION_E2E_SQL_CONNECTION: ${{ env.GOYMEN_ERP_C01_E2E_SQLSERVER_CONNECTION }}
        run: npm run activation:ci

      - name: Require exact clean activation evidence
        # Reads the emitted JUnit rather than trusting the exit code: a run that
        # skipped or retried its way to green is not evidence, and #184 disqualifies
        # a series containing either.
        if: steps.activation_gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          junit="artifacts/activation-junit.xml"
          test -f "$junit" || { echo "::error::ACTIVATION_JUNIT_MISSING: $junit"; exit 1; }
          cases=$(grep -c "<testcase" "$junit" || true)
          test "$cases" -gt 0 || { echo "::error::ACTIVATION_NO_CASES"; exit 1; }
          for tag in failure error skipped; do
            if grep -q "<$tag" "$junit"; then
              echo "::error::ACTIVATION_NOT_CLEAN: report contains <$tag>"
              exit 1
            fi
          done
          echo "C-01A activation evidence: $cases case(s), skip=0"

      - name: Verify post-browser SQL remains read-only
        env:
          GOYMEN_ERP_C01_E2E_BASELINE_EVIDENCE: ${{ github.workspace }}/artifacts/c01-e2e-fixture-evidence.json
          GOYMEN_ERP_C01_E2E_FIXTURE_EVIDENCE: ${{ github.workspace }}/artifacts/c01-e2e-post-browser-sql-evidence.json
        run: |
          dotnet run \
            --project tests/GoymenERP.C01E2eFixtureTool/GoymenERP.C01E2eFixtureTool.csproj \
            --configuration Release \
            --no-restore \
            -- verify-readonly

      - name: Capture disposable runtime state
        if: always()
        shell: bash
        run: |
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" \
            ps --all > artifacts/container-logs/compose-ps.txt 2>&1 || true

      - name: Enforce artifact privacy allowlist
        id: artifact_privacy
        if: always()
        run: |
          python3 -I -S -B tools/validate_c01_e2e_contract.py privacy \
            --root artifacts \
            --forbidden-value "$MSSQL_SA_PASSWORD" \
            --forbidden-value "$C01_E2E_CURSOR_SIGNING_KEY" \
            --forbidden-value "$GOYMEN_ERP_C01_E2E_SQLSERVER_CONNECTION"

      - name: Remove disposable containers, network and volume
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" \
            down -v --remove-orphans
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$C01_E2E_COMPOSE_PROJECT")"
          test -z "$(docker network ls -q --filter "label=com.docker.compose.project=$C01_E2E_COMPOSE_PROJECT")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$C01_E2E_COMPOSE_PROJECT")"

      - name: Preserve exact-head evidence locally
        if: always() && steps.artifact_privacy.outcome == 'success'
        shell: bash
        env:
          C01_EVIDENCE_ROOT: /home/ci/local-ci-evidence
          C01_ACTIVATION_ENABLED: ${{ steps.activation_gate.outputs.enabled }}
          C01_SAB_ENABLED: ${{ steps.sab_gate.outputs.enabled }}
        run: |
          set -euo pipefail

          workflow="c01-real-browser-e2e"
          run_id="$GITHUB_RUN_ID"
          run_attempt="$GITHUB_RUN_ATTEMPT"
          commit_sha="${GITHUB_SHA,,}"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::C01_EVIDENCE_RUN_ID_INVALID"; exit 1;
          }
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::C01_EVIDENCE_RUN_ATTEMPT_INVALID"; exit 1;
          }
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::C01_EVIDENCE_COMMIT_INVALID"; exit 1;
          }
          [[ "$C01_ACTIVATION_ENABLED" == "true" || "$C01_ACTIVATION_ENABLED" == "false" ]] || {
            echo "::error::C01_ACTIVATION_GATE_INVALID"; exit 1;
          }
          [[ "$C01_SAB_ENABLED" == "true" || "$C01_SAB_ENABLED" == "false" ]] || {
            echo "::error::C01_SAB_GATE_INVALID"; exit 1;
          }

          source_root="$(realpath -e "$GITHUB_WORKSPACE/artifacts")"
          root_input="$C01_EVIDENCE_ROOT"
          [[ "$root_input" == "/home/ci/local-ci-evidence" ]] || {
            echo "::error::C01_EVIDENCE_ROOT_INVALID"; exit 1;
          }
          mkdir -p -- "$root_input"
          [[ ! -L "$root_input" ]] || {
            echo "::error::C01_EVIDENCE_ROOT_SYMLINK"; exit 1;
          }
          evidence_root="$(realpath -e "$root_input")"
          [[ "$evidence_root" == "$root_input" && -d "$evidence_root" ]] || {
            echo "::error::C01_EVIDENCE_ROOT_UNSAFE"; exit 1;
          }

          sha7="${commit_sha:0:7}"
          directory_name="gh-${workflow}-${run_id}-${run_attempt}-${sha7}"
          destination="$(realpath -m "$evidence_root/$directory_name")"
          temporary="$(realpath -m "$evidence_root/.tmp-${directory_name}-$$-$RANDOM")"
          for owned_target in "$destination" "$temporary"; do
            [[ "$owned_target" == "$evidence_root/"* ]] || {
              echo "::error::C01_EVIDENCE_TARGET_ESCAPE"; exit 1;
            }
          done
          [[ ! -e "$destination" && ! -L "$destination" ]] || {
            echo "::error::C01_EVIDENCE_DESTINATION_EXISTS"; exit 1;
          }

          c01_files=(
            "c01-e2e-api-preflight.json"
            "c01-e2e-evidence.json"
            "c01-e2e-fixture-evidence.json"
            "c01-e2e-junit.xml"
            "c01-e2e-network-summary.json"
            "c01-e2e-post-browser-sql-evidence.json"
            "c01-e2e-html-report/index.html"
            "container-logs/compose-ps.txt"
          )
          activation_files=(
            "activation-junit.xml"
          )
          sab_files=(
            "sab-junit.xml"
            "sab-html-report/index.html"
          )
          selected_files=("${c01_files[@]}")
          if [[ "$C01_ACTIVATION_ENABLED" == "true" ]]; then
            selected_files+=("${activation_files[@]}")
          fi
          if [[ "$C01_SAB_ENABLED" == "true" ]]; then
            selected_files+=("${sab_files[@]}")
          fi

          cleanup_temporary() {
            if [[ -n "${temporary:-}" && -e "$temporary" ]]; then
              rm -rf -- "$temporary"
            fi
          }
          trap cleanup_temporary EXIT
          mkdir -- "$temporary"

          for relative in "${selected_files[@]}"; do
            [[ "$relative" != /* && "$relative" != *".."* ]] || {
              echo "::error::C01_EVIDENCE_RELATIVE_PATH_INVALID"; exit 1;
            }
            source_file="$source_root/$relative"
            [[ -e "$source_file" && -f "$source_file" && ! -L "$source_file" ]] || {
              echo "::error::C01_EVIDENCE_SELECTED_FILE_INVALID: $relative"; exit 1;
            }
            resolved_source="$(realpath -e "$source_file")"
            [[ "$resolved_source" == "$source_file" && "$resolved_source" == "$source_root/"* ]] || {
              echo "::error::C01_EVIDENCE_SELECTED_FILE_ESCAPE: $relative"; exit 1;
            }
            install -D -m 0644 -- "$resolved_source" "$temporary/$relative"
          done

          python3 -I -S -B - \
            "$temporary" "$workflow" "$run_id" "$run_attempt" "$commit_sha" "$sha7" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          files = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              relative = path.relative_to(root).as_posix()
              payload = path.read_bytes()
              files.append(
                  {
                      "path": relative,
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )
          manifest = {
              "schemaVersion": 1,
              "workflow": sys.argv[2],
              "runId": sys.argv[3],
              "runAttempt": sys.argv[4],
              "commitSha": sys.argv[5],
              "commitSha7": sys.argv[6],
              "files": files,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=True) + "\n",
              encoding="utf-8",
          )
          PY

          manifest="$temporary/manifest.json"
          python3 -I -S -B - "$temporary" "$manifest" "$workflow" "$run_id" "$run_attempt" "$commit_sha" "$sha7" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_identity = (1, sys.argv[3], sys.argv[4], sys.argv[5], sys.argv[6], sys.argv[7])
          actual_identity = (
              manifest.get("schemaVersion"),
              manifest.get("workflow"),
              manifest.get("runId"),
              manifest.get("runAttempt"),
              manifest.get("commitSha"),
              manifest.get("commitSha7"),
          )
          if actual_identity != expected_identity:
              raise SystemExit("C01_EVIDENCE_MANIFEST_IDENTITY_MISMATCH")
          entries = manifest.get("files")
          if not isinstance(entries, list) or entries != sorted(entries, key=lambda item: item["path"]):
              raise SystemExit("C01_EVIDENCE_MANIFEST_ORDER_INVALID")
          for entry in entries:
              path = root / entry["path"]
              payload = path.read_bytes()
              if entry != {
                  "path": entry["path"],
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }:
                  raise SystemExit("C01_EVIDENCE_MANIFEST_FILE_MISMATCH")
          PY

          manifest_hash="$(sha256sum "$manifest" | awk '{print $1}')"
          mv -T --no-clobber -- "$temporary" "$destination"
          [[ ! -e "$temporary" && ! -L "$temporary" ]] || {
            echo "::error::C01_EVIDENCE_PUBLICATION_REFUSED"; exit 1;
          }
          [[ -d "$destination" && ! -L "$destination" ]] || {
            echo "::error::C01_EVIDENCE_PUBLICATION_INVALID"; exit 1;
          }
          final_manifest="$destination/manifest.json"
          final_manifest_hash="$(sha256sum "$final_manifest" | awk '{print $1}')"
          [[ "$final_manifest_hash" == "$manifest_hash" ]] || {
            echo "::error::C01_EVIDENCE_MANIFEST_PUBLICATION_DRIFT"; exit 1;
          }
          trap - EXIT
          echo "C01 evidence preserved at $destination"
          echo "C01 manifest: $final_manifest"
          echo "C01 manifest SHA256: $final_manifest_hash"
