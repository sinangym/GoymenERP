name: Import Faz 0 Seed From Encrypted Package

on:
  push:
    paths:
      - .github/workflows/import-faz0-seed-filebin.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SEED_PASSPHRASE: GEF0-7bb6d4d1-29b8-4e1c-b50e-9acaf7b19b4e
  SEED_URL: https://filebin.net/goymenerp-faz0-260827-7b9f6e1c/seed.enc

jobs:
  import-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate encrypted package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 \
            --connect-timeout 15 --max-time 240 \
            "$SEED_URL" -o /tmp/seed.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/seed.enc -out /tmp/faz0.zip \
            -pass "pass:${SEED_PASSPHRASE}"
          unzip -tq /tmp/faz0.zip

      - name: Replace repository with exact 15_REPO_SEED contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/faz0 && mkdir -p /tmp/faz0
          unzip -q /tmp/faz0.zip -d /tmp/faz0
          seed="$(find /tmp/faz0 -type d -name '15_REPO_SEED' -print -quit)"
          test -n "$seed"
          test "$(find "$seed" -type f | wc -l | tr -d ' ')" = 40

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$seed"/. .

          test "$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')" = 40
          test -f AGENTS.md
          test -f README.md
          test -d docs

      - name: Commit exact seed to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sinan Göymen"
          git config user.email "235009049+sinangym@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Main already matches the exact Faz 0 seed."
          else
            git commit -m "Seed repository from Faz 0 package v1.0"
            git push origin HEAD:main
          fi
