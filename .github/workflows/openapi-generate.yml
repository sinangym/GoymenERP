name: OpenAPI generate (selectable)

# Generates the OpenAPI document of one same-repo pull request's EXACT head and preserves it in
# the self-hosted runner's local evidence store, so an API PR can retrieve the generated bytes.
# It is a helper, not a gate: it never writes contracts/, and the CI "OpenAPI contract drift" job
# stays the fail-closed check that the committed bytes are what the build generates. That job
# deliberately has no evidence publication (tests/openapi_contract_drift pins this), which is why
# this is a separate selectable workflow.
#
# Commit rule: the locally preserved openapi.json is committed byte-for-byte, with its sha256 in the
# commit message. Never edited by hand.
#
# Triggers only: workflow_dispatch(pr) once on main, or the `openapi:generate` label on a PR whose
# branch carries this workflow. Never on push or on a PR update.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose exact head is generated (same-repo branches only)
        required: true
        type: string
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: openapi-generate-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve exact head
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'openapi:generate'
    runs-on: [self-hosted, Linux, X64, goymen-ci-isolated]
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.target.outputs.pr }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      base_sha: ${{ steps.target.outputs.base_sha }}
    steps:
      - name: Resolve and validate the target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then pr="$INPUT_PR"; else pr="$EVENT_PR"; fi
          [[ "$pr" =~ ^[1-9][0-9]*$ ]] || { echo "::error::OPENAPI_PR_INVALID: '$pr'"; exit 1; }
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          state="$(jq -r '.state' <<<"$pull")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pull")"
          head_sha="$(jq -r '.head.sha' <<<"$pull")"
          base_sha="$(jq -r '.base.sha' <<<"$pull")"
          base_ref="$(jq -r '.base.ref' <<<"$pull")"
          test "$state" = "open" || { echo "::error::OPENAPI_PR_NOT_OPEN: #$pr is $state"; exit 1; }
          test "$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "::error::OPENAPI_FORK_REFUSED: #$pr comes from $head_repo; only same-repo branches run here";
            exit 1;
          }
          test "$base_ref" = "main" || { echo "::error::OPENAPI_BASE_NOT_MAIN: #$pr targets $base_ref"; exit 1; }
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::OPENAPI_HEAD_INVALID"; exit 1; }
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            test "$head_sha" = "$EVENT_HEAD_SHA" || {
              echo "::error::OPENAPI_HEAD_MOVED: #$pr moved after the label was added; label again";
              exit 1;
            }
          fi
          {
            echo "pr=$pr"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          echo "OpenAPI generation for #$pr exact head $head_sha (base $base_sha)."

  generate:
    name: "Generate OpenAPI for PR ${{ needs.resolve.outputs.pr }}"
    needs: resolve
    runs-on: [self-hosted, Linux, X64, goymen-ci-isolated]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      EXPECTED_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD || {
            echo "::error::OPENAPI_BASE_NOT_MERGED: merge main into the PR and run again";
            exit 1;
          }

      - name: .NET bootstrap preflight and workflow contract
        run: |
          python3 -I -S -B tools/validate_dotnet_bootstrap_integrity.py
          python3 -I -S -B -m unittest discover -s tests/openapi_generate_contract -p "test_*.py" -v

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: |
          python3 -I -S -B tools/validate_dotnet_bootstrap_integrity.py
          dotnet restore src/backend/GoymenERP.Api/GoymenERP.Api.csproj \
          -noAutoResponse \
          --configfile NuGet.Config

      - name: Build API and emit the OpenAPI document
        # The API project writes artifacts/openapi.json at build time (OpenApiDocumentsDirectory);
        # it is the same file the drift job compares with the baseline.
        run: |
          python3 -I -S -B tools/validate_dotnet_bootstrap_integrity.py
          dotnet build src/backend/GoymenERP.Api/GoymenERP.Api.csproj \
          -noAutoResponse \
          --configuration Release \
          --no-restore

      - name: Report the generated document
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/openapi.json || { echo "::error::OPENAPI_NOT_EMITTED: artifacts/openapi.json"; exit 1; }
          generated="$(sha256sum artifacts/openapi.json | cut -d' ' -f1)"
          baseline="$(sha256sum contracts/openapi/goymen-erp-v1.json | cut -d' ' -f1)"
          echo "generated sha256: $generated ($(wc -c < artifacts/openapi.json) bytes)"
          echo "baseline  sha256: $baseline"
          if [ "$generated" = "$baseline" ]; then
            echo "The generated document equals the committed baseline."
          else
            echo "The generated document differs from the committed baseline; commit the artifact byte-for-byte."
          fi

      - name: Preserve the generated document locally
        shell: bash
        env:
          OPENAPI_EVIDENCE_ROOT: /home/ci/local-ci-evidence
        run: |
          set -euo pipefail

          workflow="openapi-generate"
          run_id="$GITHUB_RUN_ID"
          run_attempt="$GITHUB_RUN_ATTEMPT"
          target_sha="${EXPECTED_HEAD_SHA,,}"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::OPENAPI_EVIDENCE_RUN_ID_INVALID"; exit 1;
          }
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::OPENAPI_EVIDENCE_RUN_ATTEMPT_INVALID"; exit 1;
          }
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::OPENAPI_EVIDENCE_TARGET_SHA_INVALID"; exit 1;
          }
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]] || {
            echo "::error::OPENAPI_EVIDENCE_SOURCE_DRIFT"; exit 1;
          }

          source_root="$(realpath -e "$GITHUB_WORKSPACE/artifacts")"
          source_file="$source_root/openapi.json"
          [[ -e "$source_file" && -f "$source_file" && ! -L "$source_file" ]] || {
            echo "::error::OPENAPI_EVIDENCE_SOURCE_INVALID"; exit 1;
          }
          resolved_source="$(realpath -e "$source_file")"
          [[ "$resolved_source" == "$source_file" && "$resolved_source" == "$source_root/"* ]] || {
            echo "::error::OPENAPI_EVIDENCE_SOURCE_ESCAPE"; exit 1;
          }

          root_input="$OPENAPI_EVIDENCE_ROOT"
          [[ "$root_input" == "/home/ci/local-ci-evidence" ]] || {
            echo "::error::OPENAPI_EVIDENCE_ROOT_INVALID"; exit 1;
          }
          mkdir -p -- "$root_input"
          [[ ! -L "$root_input" ]] || {
            echo "::error::OPENAPI_EVIDENCE_ROOT_SYMLINK"; exit 1;
          }
          evidence_root="$(realpath -e "$root_input")"
          [[ "$evidence_root" == "$root_input" && -d "$evidence_root" ]] || {
            echo "::error::OPENAPI_EVIDENCE_ROOT_UNSAFE"; exit 1;
          }

          target_sha7="${target_sha:0:7}"
          directory_name="gh-${workflow}-${run_id}-${run_attempt}-${target_sha7}"
          destination="$(realpath -m "$evidence_root/$directory_name")"
          temporary="$(realpath -m "$evidence_root/.tmp-${directory_name}-$$-$RANDOM")"
          for owned_target in "$destination" "$temporary"; do
            [[ "$owned_target" == "$evidence_root/"* ]] || {
              echo "::error::OPENAPI_EVIDENCE_TARGET_ESCAPE"; exit 1;
            }
          done
          [[ ! -e "$destination" && ! -L "$destination" ]] || {
            echo "::error::OPENAPI_EVIDENCE_DESTINATION_EXISTS"; exit 1;
          }

          cleanup_temporary() {
            if [[ -n "${temporary:-}" && -e "$temporary" ]]; then
              rm -rf -- "$temporary"
            fi
          }
          trap cleanup_temporary EXIT
          mkdir -- "$temporary"
          install -m 0644 -- "$resolved_source" "$temporary/openapi.json"

          python3 -I -S -B - \
            "$temporary" "$workflow" "$run_id" "$run_attempt" "$target_sha" "$target_sha7" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          payload_path = root / "openapi.json"
          payload = payload_path.read_bytes()
          manifest = {
              "schemaVersion": 1,
              "workflow": sys.argv[2],
              "runId": sys.argv[3],
              "runAttempt": sys.argv[4],
              "commitSha": sys.argv[5],
              "commitSha7": sys.argv[6],
              "files": [
                  {
                      "path": "openapi.json",
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              ],
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=True) + "\n",
              encoding="utf-8",
          )
          PY

          manifest="$temporary/manifest.json"
          python3 -I -S -B - "$temporary" "$manifest" "$workflow" "$run_id" "$run_attempt" "$target_sha" "$target_sha7" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_identity = (1, sys.argv[3], sys.argv[4], sys.argv[5], sys.argv[6], sys.argv[7])
          actual_identity = (
              manifest.get("schemaVersion"),
              manifest.get("workflow"),
              manifest.get("runId"),
              manifest.get("runAttempt"),
              manifest.get("commitSha"),
              manifest.get("commitSha7"),
          )
          if actual_identity != expected_identity:
              raise SystemExit("OPENAPI_EVIDENCE_MANIFEST_IDENTITY_MISMATCH")
          entries = manifest.get("files")
          if not isinstance(entries, list) or [entry.get("path") for entry in entries] != ["openapi.json"]:
              raise SystemExit("OPENAPI_EVIDENCE_MANIFEST_FILE_SET_INVALID")
          payload = (root / "openapi.json").read_bytes()
          expected_entry = {
              "path": "openapi.json",
              "bytes": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest(),
          }
          if entries[0] != expected_entry:
              raise SystemExit("OPENAPI_EVIDENCE_MANIFEST_FILE_MISMATCH")
          PY

          manifest_hash="$(sha256sum "$manifest" | awk '{print $1}')"
          mv -T --no-clobber -- "$temporary" "$destination"
          [[ ! -e "$temporary" && ! -L "$temporary" ]] || {
            echo "::error::OPENAPI_EVIDENCE_PUBLICATION_REFUSED"; exit 1;
          }
          [[ -d "$destination" && ! -L "$destination" ]] || {
            echo "::error::OPENAPI_EVIDENCE_PUBLICATION_INVALID"; exit 1;
          }
          final_manifest="$destination/manifest.json"
          final_manifest_hash="$(sha256sum "$final_manifest" | awk '{print $1}')"
          [[ "$final_manifest_hash" == "$manifest_hash" ]] || {
            echo "::error::OPENAPI_EVIDENCE_MANIFEST_PUBLICATION_DRIFT"; exit 1;
          }
          trap - EXIT
          echo "OpenAPI evidence preserved at $destination"
          echo "OpenAPI manifest: $final_manifest"
          echo "OpenAPI manifest SHA256: $final_manifest_hash"
