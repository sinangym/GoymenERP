name: Browser acceptance (selectable)

# BROWSER-CI (Business/Sinan, #66 5731422079): the existing C-01 pattern (real API + SQL + Chromium)
# extended as a narrow, SELECTABLE test job. It never runs on push, and never runs just because a PR
# was updated. Two triggers only:
#   - workflow_dispatch: suite + PR number. The PR's EXACT head sha is resolved from the API and that
#     code is tested under this workflow as it stands on main. Same-repo branches only; fork PRs are
#     out of scope and refused.
#   - pull_request `labeled` with a `browser:<suite>` label: the labelled PR's exact head, once its
#     branch carries this workflow.
# Suites are owned by their feature owners: each is one `browser:<suite>:ci` script in
# tests/e2e/package.json that honours the BROWSER_E2E_* contract below. A missing script fails
# visibly as SUITE_NOT_READY; nothing is skipped to green.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Browser suite to run (smoke = plumbing only, never feature acceptance)
        required: true
        type: choice
        options:
          - smoke
          - c03
          - org03
          - u02
          - s03
          - mfg
          - fin01
          - s04
          - acc01
          - l04
          - pur01
          - r14
          - c02
      pr:
        description: Pull request number whose exact head is tested (same-repo branches only)
        required: true
        type: string
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: browser-acceptance-${{ inputs.suite || github.event.label.name }}-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve suite and exact head
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'browser:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.target.outputs.suite }}
      pr: ${{ steps.target.outputs.pr }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      read_only: ${{ steps.target.outputs.read_only }}
    steps:
      - name: Resolve and validate the target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_PR: ${{ inputs.pr }}
          LABEL: ${{ github.event.label.name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            suite="$INPUT_SUITE"
            pr="$INPUT_PR"
          else
            suite="${LABEL#browser:}"
            pr="$EVENT_PR"
          fi
          case "$suite" in
            smoke|c03) read_only=true ;;
            org03|u02|s03|mfg|fin01|s04|acc01|l04|pur01|r14|c02) read_only=false ;;
            *) echo "::error::BROWSER_SUITE_UNKNOWN: '$suite'"; exit 1 ;;
          esac
          [[ "$pr" =~ ^[1-9][0-9]*$ ]] || { echo "::error::BROWSER_PR_INVALID: '$pr'"; exit 1; }

          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          state="$(jq -r '.state' <<<"$pull")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pull")"
          head_sha="$(jq -r '.head.sha' <<<"$pull")"
          base_sha="$(jq -r '.base.sha' <<<"$pull")"
          base_ref="$(jq -r '.base.ref' <<<"$pull")"
          test "$state" = "open" || { echo "::error::BROWSER_PR_NOT_OPEN: #$pr is $state"; exit 1; }
          test "$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "::error::BROWSER_FORK_REFUSED: #$pr comes from $head_repo; only same-repo branches run here";
            exit 1;
          }
          test "$base_ref" = "main" || { echo "::error::BROWSER_BASE_NOT_MAIN: #$pr targets $base_ref"; exit 1; }
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::BROWSER_HEAD_INVALID"; exit 1; }
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # A label run tests exactly the head the event was raised for.
            test "$head_sha" = "$EVENT_HEAD_SHA" || {
              echo "::error::BROWSER_HEAD_MOVED: #$pr moved after the label was added; label again";
              exit 1;
            }
          fi
          {
            echo "suite=$suite"
            echo "pr=$pr"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "read_only=$read_only"
          } >> "$GITHUB_OUTPUT"
          echo "Browser suite '$suite' on #$pr exact head $head_sha (base $base_sha; read-only: $read_only)."

  browser:
    name: "Browser suite ${{ needs.resolve.outputs.suite }} on PR ${{ needs.resolve.outputs.pr }}"
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      C01_E2E_COMPOSE_FILE: infra/docker-compose.c01-e2e.yml
      C01_E2E_SQL_PORT: "11433"
      C01_E2E_API_PORT: "15080"
      C01_E2E_AUTHORIZED_WEB_PORT: "15173"
      C01_E2E_UNAUTHORIZED_WEB_PORT: "15174"
      BROWSER_SUITE: ${{ needs.resolve.outputs.suite }}
      EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      EXPECTED_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and disposable run secrets
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          # Same rule as C-01: the head under test must carry its base (main).
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD || {
            echo "::error::BROWSER_BASE_NOT_MERGED: merge main into the PR and run again";
            exit 1;
          }

          # The API's disposable activation (C01E2eShellCapabilityActivation) accepts only the C-01
          # project shape goymen-c01-<run>-<attempt>; the run id already keeps it unique.
          compose_project="goymen-c01-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The C-01 compose validator and fixture tool derive the database name from the run id and
          # attempt as GoymenErpC01_<run>_<attempt>; it is disposable either way.
          database_name="GoymenErpC01_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sql_password="BR_$(openssl rand -hex 20)_Aa1!"
          cursor_key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$cursor_key"
          {
            echo "C01_E2E_TESTED_COMMIT=$actual_head"
            echo "C01_E2E_COMPOSE_PROJECT=$compose_project"
            echo "C01_E2E_DATABASE_NAME=$database_name"
            echo "COMPOSE_PROJECT_NAME=$compose_project"
            echo "MSSQL_SA_PASSWORD=$sql_password"
            echo "C01_E2E_CURSOR_SIGNING_KEY=$cursor_key"
            echo "GOYMEN_ERP_C01_E2E_SQLSERVER_CONNECTION=Server=127.0.0.1,${C01_E2E_SQL_PORT};Database=${database_name};User Id=sa;Password=${sql_password};Encrypt=True;TrustServerCertificate=True"
            echo "GOYMEN_ERP_C01_E2E_DISPOSABLE=CONFIRMED"
            echo "GOYMEN_ERP_C01_E2E_TESTED_COMMIT=$actual_head"
            echo "GOYMEN_ERP_C01_E2E_RUN_ID=$GITHUB_RUN_ID"
            echo "GOYMEN_ERP_C01_E2E_COMPOSE_PROJECT=$compose_project"
            echo "GOYMEN_ERP_C01_E2E_FIXTURE_EVIDENCE=$GITHUB_WORKSPACE/artifacts/browser-fixture-evidence.json"
            echo "BROWSER_E2E_JUNIT_FILE=$GITHUB_WORKSPACE/artifacts/browser-${BROWSER_SUITE}-junit.xml"
          } >> "$GITHUB_ENV"
          mkdir -p artifacts/container-logs
          # The cleanup steps below run only once this point is reached: before it there is no
          # stack, no artifact root and no project name, and failing them again would only bury
          # the real refusal above.
          echo "bound=true" >> "$GITHUB_OUTPUT"

      - name: Validate browser workflow contract tooling
        run: |
          python3 -I -S -B -m unittest discover \
            -s tests/browser_acceptance_contract \
            -p "test_*.py" \
            -v

      - name: Select the suite's capability profile
        # Stage 2: c01-list-only (canonical), cari-staged or normal, each with its own compose file.
        # An unknown suite or profile fails here; nothing falls back to another profile.
        shell: bash
        run: |
          set -euo pipefail
          selection="$(python3 -I -S -B tools/validate_browser_acceptance.py profile --suite "$BROWSER_SUITE")"
          profile="$(sed -n 's/^profile=//p' <<<"$selection")"
          compose_file="$(sed -n 's/^compose_file=//p' <<<"$selection")"
          override_file="$(sed -n 's/^override_file=//p' <<<"$selection")"
          fixture="$(sed -n 's/^fixture=//p' <<<"$selection")"
          test -n "$profile" && test -f "$compose_file"
          test -z "$override_file" || test -f "$override_file"
          test "$fixture" = "true" || test "$fixture" = "false"
          {
            echo "BROWSER_E2E_PROFILE=$profile"
            echo "C01_E2E_COMPOSE_FILE=$compose_file"
            # Stage 2 (a2): the suite's own closed-list API extensions, validated with the merged model.
            echo "BROWSER_E2E_COMPOSE_OVERRIDE=$override_file"
            # Stage 2 (a2 part 2): whether the suite owner seeds data through the fixture runner.
            echo "BROWSER_E2E_SUITE_FIXTURE=$fixture"
          } >> "$GITHUB_ENV"
          echo "Suite '$BROWSER_SUITE' runs under capability profile '$profile' ($compose_file)."

      - name: Require the suite's browser script
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/e2e/package.json || { echo "::error::SUITE_NOT_READY: tests/e2e/package.json missing"; exit 1; }
          test -f tests/e2e/package-lock.json || { echo "::error::SUITE_NOT_READY: tests/e2e/package-lock.json missing"; exit 1; }
          script="browser:${BROWSER_SUITE}:ci"
          if ! jq -e --arg s "$script" '.scripts[$s] | type == "string"' tests/e2e/package.json >/dev/null; then
            echo "::error::SUITE_NOT_READY: '$script' is not in tests/e2e/package.json at $EXPECTED_HEAD_SHA (the suite owner adds it)"
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate loopback-only compose model
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BROWSER_E2E_PROFILE" = "c01-list-only" ]; then
            docker compose \
              -p "$C01_E2E_COMPOSE_PROJECT" \
              -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
              config --format json \
              | python3 -I -S -B tools/validate_c01_e2e_contract.py compose \
                  --input - \
                  --expected-commit "$C01_E2E_TESTED_COMMIT" \
                  --expected-project "$C01_E2E_COMPOSE_PROJECT"
          else
            # The profile's exact difference from the canonical model, then every canonical rule.
            docker compose \
              -p "$C01_E2E_COMPOSE_PROJECT" \
              -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
              config --format json \
              | python3 -I -S -B tools/validate_browser_acceptance.py compose \
                  --suite "$BROWSER_SUITE" \
                  --expected-commit "$C01_E2E_TESTED_COMMIT" \
                  --expected-project "$C01_E2E_COMPOSE_PROJECT"
          fi

      - name: Restore fixture materializer
        run: |
          dotnet restore \
            tests/GoymenERP.C01E2eFixtureTool/GoymenERP.C01E2eFixtureTool.csproj \
            -noAutoResponse \
            --configfile NuGet.Config

      - name: Restore suite fixture runner
        if: env.BROWSER_E2E_SUITE_FIXTURE == 'true'
        run: |
          dotnet restore \
            tests/GoymenERP.BrowserSuiteFixtureTool/GoymenERP.BrowserSuiteFixtureTool.csproj \
            -noAutoResponse \
            --configfile NuGet.Config

      - name: Build and start disposable SQL/API
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
            up -d --build sqlserver api
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${C01_E2E_API_PORT}/health/live" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          # Diagnostics go to this job log only (secrets are masked), never into an artifact.
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} ps --all
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} logs --no-color --tail 80 api || true
          exit 1

      - name: Materialize and verify canonical fixture
        run: |
          dotnet run \
            --project tests/GoymenERP.C01E2eFixtureTool/GoymenERP.C01E2eFixtureTool.csproj \
            --configuration Release \
            --no-restore \
            -- materialize

      - name: Build the suite fixture runner
        # Building the runner builds the Api, whose build-time OpenAPI generation starts Program with this
        # process's environment. The run's C-01 envelope variables (exported to every step for the
        # canonical path) would make Program request the disposable envelope outside Testing and fail the
        # build (run 35392194453). So the build runs with every envelope variable removed (by prefix, so a
        # new one is removed too); the next step runs the built runner with --no-build.
        if: env.BROWSER_E2E_SUITE_FIXTURE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          envelope=()
          while IFS= read -r name; do envelope+=(-u "$name"); done \
            < <(compgen -e | grep -E '^(GOYMEN_ERP_C01_E2E_|C01E2e__)' || true)
          env "${envelope[@]}" dotnet build \
            tests/GoymenERP.BrowserSuiteFixtureTool/GoymenERP.BrowserSuiteFixtureTool.csproj \
            -noAutoResponse \
            --configuration Release \
            --no-restore

      - name: Materialize the suite's fixture
        # Stage 2 (a2 part 2): the suite owner's seed runs through the real API host (in process, the
        # container's validated environment, the disposable database over loopback): real endpoints and
        # services only, no SQL writes. Its outputs reach the browser suite as BROWSER_E2E_<SUITE>_SEED.
        if: env.BROWSER_E2E_SUITE_FIXTURE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compose_model="$RUNNER_TEMP/browser-suite-compose.json"
          api_environment="$RUNNER_TEMP/browser-suite-api-environment.json"
          trap 'rm -f "$compose_model" "$api_environment"' EXIT
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
            config --format json > "$compose_model"
          python3 -I -S -B tools/validate_browser_acceptance.py api-environment \
            --suite "$BROWSER_SUITE" \
            --expected-commit "$C01_E2E_TESTED_COMMIT" \
            --expected-project "$C01_E2E_COMPOSE_PROJECT" \
            --out "$api_environment" < "$compose_model"
          BROWSER_E2E_API_ENVIRONMENT="$api_environment" \
          BROWSER_E2E_SUITE_FIXTURE_EVIDENCE="$GITHUB_WORKSPACE/artifacts/browser-suite-fixture-evidence.json" \
          BROWSER_E2E_SUITE_SEED_FILE="$GITHUB_WORKSPACE/artifacts/browser-suite-seed.json" \
          dotnet run \
            --project tests/GoymenERP.BrowserSuiteFixtureTool/GoymenERP.BrowserSuiteFixtureTool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- materialize --suite "$BROWSER_SUITE"
          python3 -I -S -B tools/validate_browser_acceptance.py seed-export \
            --suite "$BROWSER_SUITE" \
            --seed "$GITHUB_WORKSPACE/artifacts/browser-suite-seed.json" >> "$GITHUB_ENV"

      - name: Build and start authorized and unauthorized web profiles
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
            up -d --build web-authorized web-unauthorized
          for port in "$C01_E2E_AUTHORIZED_WEB_PORT" "$C01_E2E_UNAUTHORIZED_WEB_PORT"; do
            ready=false
            for attempt in $(seq 1 90); do
              if curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              # Job log only (secrets masked), never an artifact.
              docker compose \
                -p "$C01_E2E_COMPOSE_PROJECT" \
                -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} ps --all
              docker compose \
                -p "$C01_E2E_COMPOSE_PROJECT" \
                -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} logs --no-color --tail 80 web-authorized web-unauthorized api || true
              exit 1
            fi
          done

      - name: Install pinned browser runner
        working-directory: tests/e2e
        run: |
          npm ci
          npm audit --audit-level=high
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the selected suite
        working-directory: tests/e2e
        env:
          BROWSER_E2E_AUTHORIZED_BASE_URL: http://127.0.0.1:15173
          BROWSER_E2E_UNAUTHORIZED_BASE_URL: http://127.0.0.1:15174
          BROWSER_E2E_API_BASE_URL: http://127.0.0.1:15080
          BROWSER_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          BROWSER_E2E_SQL_CONNECTION: ${{ env.GOYMEN_ERP_C01_E2E_SQLSERVER_CONNECTION }}
          BROWSER_E2E_DATABASE: ${{ env.C01_E2E_DATABASE_NAME }}
          BROWSER_E2E_TESTED_COMMIT: ${{ env.C01_E2E_TESTED_COMMIT }}
          BROWSER_E2E_PROFILE: ${{ env.BROWSER_E2E_PROFILE }}
        run: npm run "browser:${BROWSER_SUITE}:ci"

      - name: Require exact clean suite evidence
        # Reads the emitted JUnit rather than trusting the exit code: a run that skipped or retried
        # its way to green is not evidence.
        shell: bash
        run: |
          set -euo pipefail
          junit="$BROWSER_E2E_JUNIT_FILE"
          test -f "$junit" || { echo "::error::BROWSER_JUNIT_MISSING: $junit"; exit 1; }
          cases=$(grep -c "<testcase" "$junit" || true)
          test "$cases" -gt 0 || { echo "::error::BROWSER_NO_CASES"; exit 1; }
          for tag in failure error skipped; do
            if grep -q "<$tag" "$junit"; then
              echo "::error::BROWSER_NOT_CLEAN: report contains <$tag>"
              exit 1
            fi
          done
          echo "Browser suite '$BROWSER_SUITE' at $C01_E2E_TESTED_COMMIT: $cases case(s), failure=0 error=0 skip=0"

      - name: Verify post-browser SQL remains read-only
        # Only for suites that declare themselves read-only (smoke, c03); a writing suite owns its
        # own post-condition checks inside its specs.
        if: needs.resolve.outputs.read_only == 'true'
        env:
          GOYMEN_ERP_C01_E2E_BASELINE_EVIDENCE: ${{ github.workspace }}/artifacts/browser-fixture-evidence.json
          GOYMEN_ERP_C01_E2E_FIXTURE_EVIDENCE: ${{ github.workspace }}/artifacts/browser-post-browser-sql-evidence.json
        run: |
          dotnet run \
            --project tests/GoymenERP.C01E2eFixtureTool/GoymenERP.C01E2eFixtureTool.csproj \
            --configuration Release \
            --no-restore \
            -- verify-readonly

      - name: Capture disposable runtime state
        if: always() && steps.bind.outputs.bound == 'true'
        shell: bash
        run: |
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
            ps --all > artifacts/container-logs/compose-ps.txt 2>&1 || true

      - name: Enforce artifact privacy allowlist
        id: artifact_privacy
        if: always() && steps.bind.outputs.bound == 'true'
        run: |
          set -euo pipefail
          compose_model="$RUNNER_TEMP/browser-suite-artifact-privacy-compose.json"
          trap 'rm -f "$compose_model"' EXIT
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
            config --format json > "$compose_model"
          python3 -I -S -B tools/validate_browser_acceptance.py privacy \
            --root artifacts \
            --suite "$BROWSER_SUITE" \
            --compose-model "$compose_model" \
            --forbidden-value "$MSSQL_SA_PASSWORD" \
            --forbidden-value "$C01_E2E_CURSOR_SIGNING_KEY" \
            --forbidden-value "$GOYMEN_ERP_C01_E2E_SQLSERVER_CONNECTION"

      - name: Remove disposable containers, network and volume
        if: always() && steps.bind.outputs.bound == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$C01_E2E_COMPOSE_PROJECT" \
            -f "$C01_E2E_COMPOSE_FILE" ${BROWSER_E2E_COMPOSE_OVERRIDE:+-f "$BROWSER_E2E_COMPOSE_OVERRIDE"} \
            down -v --remove-orphans
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$C01_E2E_COMPOSE_PROJECT")"
          test -z "$(docker network ls -q --filter "label=com.docker.compose.project=$C01_E2E_COMPOSE_PROJECT")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$C01_E2E_COMPOSE_PROJECT")"

      - name: Upload exact-head browser evidence
        if: always() && steps.artifact_privacy.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ needs.resolve.outputs.suite }}-${{ needs.resolve.outputs.head_sha }}
          path: |
            artifacts/browser-${{ needs.resolve.outputs.suite }}-junit.xml
            artifacts/browser-fixture-evidence.json
            artifacts/browser-suite-fixture-evidence.json
            artifacts/browser-suite-seed.json
            artifacts/browser-post-browser-sql-evidence.json
            artifacts/container-logs/compose-ps.txt
          if-no-files-found: warn
          retention-days: 7
