<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Göymen ERP — Cari Çalışma Alanı v3</title>
<style>
:root{
  --bg:#eef2f1;
  --surface:#ffffff;
  --surface-muted:#f5f7f7;
  --surface-2:#f9fbfb;
  --border:#d7dfdf;
  --border-strong:#a9b8b8;
  --text:#33424a;
  --text-strong:#101820;
  --muted:#66747c;
  --steel:#22313a;
  --steel-soft:#e2e9ea;
  --navy:#103541;
  --navy-2:#174957;
  --teal:#0d6f68;
  --teal-strong:#074d49;
  --teal-soft:#d7f0ec;
  --teal-line:#8ccfc7;
  --success:#2f7d4f;
  --success-strong:#245d3c;
  --success-soft:#dff1e7;
  --success-line:#9ed3b8;
  --amber:#b66a18;
  --amber-soft:#fff0d6;
  --amber-line:#f2c887;
  --danger:#c2413a;
  --danger-strong:#8f2722;
  --danger-soft:#fde5e3;
  --danger-line:#f5b8b4;
  --blue:#1d5d84;
  --blue-soft:#e4f0f7;
  --blue-line:#b6d4e6;
  --purple:#6c58a6;
  --purple-soft:#eeeafb;
  --purple-line:#d2c7ed;
  --shadow:0 8px 22px rgba(24,36,48,.07);
  --shadow-soft:0 4px 14px rgba(24,36,48,.055);
  --shadow-strong:0 18px 46px rgba(15,31,38,.18);
  --radius:12px;
  --sidebar:246px;
  --ai:336px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
  font-synthesis:none;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{min-width:900px;min-height:100vh;background:var(--bg);overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal-line);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);height:100vh}

/* SOL MENÜ */
.sidebar{background:#f0f4f8;border-right:1px solid #e0e6eb;display:flex;flex-direction:column;min-width:0;z-index:6}
.brand{height:64px;background:#fff;border-bottom:1px solid #e0e6eb;display:flex;align-items:center;gap:11px;padding:0 17px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--navy),var(--teal));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 7px 15px rgba(13,111,104,.19);flex:0 0 auto}
.brand-text strong{display:block;color:var(--text-strong);font-size:15px;letter-spacing:.025em}
.brand-text span{display:block;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.08em;margin-top:2px}
.menu-search{padding:12px 12px 8px}
.menu-search-wrap{position:relative}
.menu-search input{width:100%;height:36px;border:1px solid #dde5e9;border-radius:8px;background:#fff;color:var(--text);padding:0 34px 0 11px;outline:none;font-size:12.5px}
.menu-search-wrap:after{content:'⌕';position:absolute;right:11px;top:5px;color:#75838b;font-size:19px;transform:rotate(-15deg)}
.nav{overflow:auto;padding:3px 10px 14px;scrollbar-width:thin}
.nav-section{border-top:1px solid #e2e7eb;margin-top:6px;padding-top:6px}
.nav-section:first-child{border-top:0;margin-top:0}
.nav-section-title{display:flex;align-items:center;gap:6px;color:#6b7280;font-size:10.5px;font-weight:850;letter-spacing:.045em;padding:7px 8px 4px;text-transform:uppercase}
.nav-item{width:100%;min-height:36px;border:0;background:transparent;color:#2d3842;border-radius:8px;text-align:left;padding:8px 10px;margin:1px 0;font-size:12.5px;font-weight:680;display:flex;align-items:center;gap:9px}
.nav-item:hover{background:#e0e7e8}
.nav-item.active{background:var(--teal);color:#fff;box-shadow:0 6px 14px rgba(13,111,104,.17)}
.nav-item.sub{padding-left:17px;font-weight:650}
.nav-icon{width:20px;flex:0 0 20px;text-align:center;font-weight:900}
.nav-label{min-width:0;flex:1}
.nav-item .count{min-width:25px;height:21px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.82);color:var(--teal);display:grid;place-items:center;font-size:10px;font-weight:850}
.nav-item:not(.active) .count{background:#e3e9eb;color:#63717a}
.sidebar-foot{margin-top:auto;border-top:1px solid #e0e6eb;padding:11px 13px;background:#f7f9fb}
.system{display:flex;align-items:center;gap:8px;color:#66747c;font-size:11.5px}
.system-dot{width:8px;height:8px;border-radius:50%;background:#37a368;box-shadow:0 0 0 3px #dff1e7;flex:0 0 auto}

/* ANA ALAN */
.main{min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;flex:0 0 auto;z-index:5}
.page-identity{min-width:180px;max-width:245px}
.page-identity small{display:block;color:var(--teal);font-size:10px;font-weight:900;letter-spacing:.055em;text-transform:uppercase}
.page-identity strong{display:block;color:var(--text-strong);font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.global-search{position:relative;flex:0 1 430px}
.global-search input{width:100%;height:38px;border:1px solid var(--border);border-radius:10px;background:#f8faf9;padding:0 42px 0 37px;outline:none;color:var(--text);font-size:12.5px}
.global-search:before{content:'⌕';position:absolute;left:13px;top:7px;color:var(--muted);font-size:20px;line-height:22px;transform:rotate(-15deg)}
.shortcut{position:absolute;right:10px;top:8px;color:#87939a;border:1px solid #dce3e3;border-radius:6px;font-size:10px;padding:2px 5px;background:#fff}
.company-scope{height:37px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:0 9px;font-size:11.5px;font-weight:750}
.top-spacer{flex:1}
.top-date{color:var(--muted);font-size:11.5px;white-space:nowrap}
.icon-btn{height:38px;min-width:38px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--teal);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:11.5px;font-weight:850;box-shadow:var(--shadow-soft)}
.icon-btn:hover{border-color:var(--teal-line);background:var(--teal-soft)}
.icon-btn.ai-toggle.active{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal-strong)}
.user{display:flex;align-items:center;gap:9px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--steel),var(--navy-2));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:850;position:relative;flex:0 0 auto}
.avatar:after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#37a368}
.user-text strong{display:block;color:var(--text-strong);font-size:11.5px}
.user-text span{display:block;color:var(--muted);font-size:10px;margin-top:2px}

.content{min-height:0;overflow:auto;padding:16px 18px 28px;scrollbar-width:thin;position:relative}
.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;margin:0 0 10px 2px}
.breadcrumb b{color:var(--teal)}

/* ORTAK BİLEŞENLER */
.page-header{display:flex;align-items:flex-start;gap:16px;padding:14px 15px;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.page-header-copy{min-width:0}
.page-header-copy h1{margin:0;color:var(--text-strong);font-size:21px;line-height:1.2}
.page-header-copy p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.header-actions{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.btn{height:35px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);padding:0 11px;font-size:11.5px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 5px 12px rgba(13,111,104,.16)}
.btn.primary:hover{background:var(--teal-strong);color:#fff}
.btn.soft{background:var(--teal-soft);color:var(--teal-strong);border-color:#bbdcd8}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.btn.small{height:30px;padding:0 9px;font-size:10.5px}
.link-btn{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:850;padding:4px 2px}
.link-btn:hover{color:var(--teal-strong);text-decoration:underline}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:850;white-space:nowrap;border:1px solid transparent}
.tag.green{background:var(--success-soft);color:var(--success);border-color:var(--success-line)}
.tag.teal{background:var(--teal-soft);color:var(--teal-strong);border-color:var(--teal-line)}
.tag.blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.tag.purple{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.tag.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.tag.red{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.tag.gray{background:#edf1f1;color:#66747c;border-color:#d9e0e0}
.tag.compact{min-height:21px;padding:2px 6px;font-size:9.5px}

.scope-bar,.filter-bar,.view-bar,.data-freshness{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.data-freshness{padding:7px 10px;background:#f8fbfa;color:var(--muted);font-size:10.5px}
.data-freshness b{color:var(--text)}
.scope-label{color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.segment{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#f7f9f9;max-width:100%}
.segment button{height:31px;border:0;border-right:1px solid var(--border);background:transparent;color:var(--muted);padding:0 10px;font-size:10.5px;font-weight:850;white-space:nowrap}
.segment button:last-child{border-right:0}
.segment button.active{background:#fff;color:var(--teal-strong);box-shadow:inset 0 -3px var(--teal)}
.warning-filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.toggle-chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:31px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--muted);font-size:10.5px;font-weight:800}
.toggle-chip.active{border-color:var(--teal-line);background:var(--teal-soft);color:var(--teal-strong)}
.toggle-chip .dot{width:7px;height:7px;border-radius:50%;background:#b7c2c2}
.toggle-chip.active .dot{background:var(--teal)}
.filter-input,.filter-select{height:33px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);padding:0 9px;font-size:11.5px}
.filter-input{min-width:220px;flex:1 1 240px}
.filter-select{min-width:125px}
.filter-spacer{flex:1}

.operation-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-soft);padding:11px 12px;min-height:88px;position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;right:-22px;top:-22px;width:62px;height:62px;border-radius:50%;background:rgba(13,111,104,.055)}
.kpi-label{color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.025em}
.kpi-value{color:var(--text-strong);font-size:19px;font-weight:880;margin-top:8px;white-space:nowrap}
.kpi-sub{color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.3}
.kpi-sub strong{color:var(--text);font-weight:850}
.kpi.alert .kpi-value{color:var(--danger)}
.kpi.good .kpi-value{color:var(--success)}
.kpi.amber .kpi-value{color:var(--amber)}
.kpi.teal .kpi-value{color:var(--teal-strong)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-soft);min-width:0}
.card-head{min-height:49px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border)}
.card-title{min-width:0}
.card-title strong{display:block;color:var(--text-strong);font-size:13.5px}
.card-title span{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;line-height:1.35}
.card-head .head-right{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card-body{padding:12px 13px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px;margin-top:11px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:11px}
.stack{display:grid;gap:11px;min-width:0}
.split-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.split-title h3{margin:0;color:var(--text-strong);font-size:14px}

.table-card{margin-top:10px;overflow:hidden}
.table-scroll{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse}
th{height:35px;text-align:left;color:#6f7e84;background:#f8faf9;font-size:11px;text-transform:uppercase;letter-spacing:.022em;font-weight:900;padding:0 9px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
td{height:45px;padding:6px 9px;border-bottom:1px solid #e9eeee;font-size:12.3px;color:var(--text);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:#fafcfc}
tbody tr:last-child td{border-bottom:0}
tbody tr.selected-row{background:var(--teal-soft)}
.row-title{font-weight:850;color:var(--teal-strong)}
button.row-title{border:0;background:transparent;padding:0;text-align:left;font-size:inherit}
button.row-title:hover{text-decoration:underline}
.row-sub{display:block;color:var(--muted);font-size:10.3px;margin-top:2px;line-height:1.25}
.actions{display:flex;justify-content:flex-end;gap:4px}
.icon-mini{width:29px;height:29px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--teal);display:grid;place-items:center;font-size:11px;font-weight:900}
.icon-mini:hover{background:var(--teal-soft);border-color:var(--teal-line)}
.progress{height:6px;background:#e7ecec;border-radius:999px;overflow:hidden;margin-top:5px;min-width:76px}
.progress>span{display:block;height:100%;background:var(--teal);border-radius:999px}
.progress.purple>span{background:var(--purple)}
.progress.amber>span{background:var(--amber)}
.progress.red>span{background:var(--danger)}
.position-cell{display:grid;gap:3px;min-width:145px}
.position-line{display:flex;justify-content:space-between;gap:10px;font-size:11px}
.position-line span{color:var(--muted)}
.position-line b{color:var(--text-strong)}
.status-stack{display:grid;gap:4px;justify-items:start}
.meta-note{color:var(--muted);font-size:10.5px;line-height:1.4}

/* CARİ DETAY */
.customer-head{position:sticky;top:0;z-index:4;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:12px;box-shadow:var(--shadow);padding:13px 14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;transition:.16s ease}
.customer-head.compact{padding-top:8px;box-shadow:0 10px 28px rgba(24,36,48,.12)}
.customer-head.compact .company-logo{width:36px;height:36px;border-radius:9px;font-size:13px}
.customer-head.compact .company-meta,.customer-head.compact .status-row{display:none}
.customer-head.compact .title-row h1{font-size:16px}
.customer-head.compact .detail-tabs{margin-top:6px}
.company-main{display:flex;gap:11px;min-width:0}
.company-logo{width:48px;height:48px;border-radius:11px;background:linear-gradient(145deg,var(--steel-soft),var(--teal-soft));color:var(--teal-strong);display:grid;place-items:center;font-size:16px;font-weight:900;border:1px solid #cbd9d8;flex:0 0 auto;transition:.16s ease}
.company-copy{min-width:0}
.title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.title-row h1{margin:0;color:var(--text-strong);font-size:20px;line-height:1.2;letter-spacing:-.015em}
.role-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:4px}
.company-meta{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:10.8px;margin-top:6px}
.company-meta b{color:var(--text);font-weight:780}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.head-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:510px}
.detail-tabs{display:flex;gap:2px;align-items:end;border-top:1px solid var(--border);margin:11px -14px 0;padding:0 11px;overflow:auto;grid-column:1/-1}
.detail-tab{height:42px;border:0;background:transparent;padding:0 12px;color:var(--muted);font-size:11.5px;font-weight:850;white-space:nowrap;border-bottom:3px solid transparent}
.detail-tab:hover{color:var(--teal)}
.detail-tab.active{color:var(--teal-strong);border-bottom-color:var(--teal)}
.detail-tab .badge{margin-left:5px;background:#e7ecec;color:#69777d;border-radius:999px;padding:2px 6px;font-size:9.5px}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.subtab{height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);padding:0 10px;font-size:10.5px;font-weight:850}
.subtab.active{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal-strong)}

.summary-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,.9fr);gap:11px;margin-top:11px;align-items:start}
.account-side-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:11px 12px}
.account-side{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:10px}
.account-side h4{margin:0;color:var(--text-strong);font-size:12.5px}
.account-side .side-caption{color:var(--muted);font-size:10px;margin-top:2px}
.currency-list{display:grid;gap:7px;margin-top:9px}
.currency-line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11px}
.currency-code{font-size:9.5px;font-weight:900;color:var(--teal);background:var(--teal-soft);border-radius:6px;padding:3px 6px;text-align:center}
.currency-line span{color:var(--muted)}
.currency-line b{color:var(--text-strong);font-variant-numeric:tabular-nums}
.age-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.age{border-top:2px solid #d8e0df;padding-top:5px}
.age.alert{border-color:var(--danger)}
.age.amber{border-color:var(--amber)}
.age b{display:block;font-size:10px;color:var(--text)}
.age span{display:block;font-size:9px;color:var(--muted);margin-top:2px}

.risk-body{padding:12px 13px 13px}
.risk-amount{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.risk-amount .main-value{font-size:26px;font-weight:900;color:var(--text-strong);line-height:1}
.risk-amount .main-value small{font-size:10.5px;color:var(--muted);font-weight:750}
.risk-ratio{text-align:right}.risk-ratio b{display:block;color:var(--teal);font-size:16px}.risk-ratio span{font-size:9.5px;color:var(--muted)}
.risk-bar{height:9px;background:#e7ecec;border-radius:999px;overflow:hidden;margin:11px 0 9px;position:relative}
.risk-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3aa28f);border-radius:999px}
.risk-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:9.5px;margin-top:-3px}
.risk-lines{display:grid;gap:7px;margin-top:11px}
.risk-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px}

function trNumber(value, digits=0){
  return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value);
}
function money(value,currency='TRY',compact=true){
  const symbols={TRY:'₺',USD:'$',EUR:'€'};
  const sign=value<0?'−':'';
  const abs=Math.abs(value);
  if(!compact) return `${sign}${symbols[currency]}${trNumber(abs,currency==='TRY'?0:2)}`;
  if(abs>=1000000) return `${sign}${symbols[currency]}${trNumber(abs/1000000,2)} Mn`;
  if(abs>=1000) return `${sign}${symbols[currency]}${trNumber(abs/1000,0)} bin`;
  return `${sign}${symbols[currency]}${trNumber(abs,0)}`;
}
function pct(c){ return c.limit>0 ? Math.round((c.risk/c.limit)*1000)/10 : 0; }
function roleTags(roles){
  return roles.map((r,i)=>`<span class="tag compact ${r.includes('Fason')?'purple':i%2===0?'blue':'teal'}">${r}</span>`).join('');
}
function lifecycleTag(status){
  const map={Aktif:'green',Pasif:'gray',Birleştirildi:'blue',Arşivlendi:'gray'};
  return `<span class="tag ${map[status]||'gray'}">${status}</span>`;
}
function riskTag(status){
  const map={'Limit İçinde':'green','Limite Yakın':'amber','Limit Aşımı':'red','Uygulanmaz':'gray'};
  return `<span class="tag ${map[status]||'gray'}">${status}</span>`;
}
function kpiSection(items){
  return `<section class="operation-summary">${items.map(x=>`<article class="kpi ${x.tone||''}"><div class="kpi-label">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub||''}</div></article>`).join('')}</section>`;
}
function termTag(text,tone){ return `<span class="tag ${tone||'gray'}">${text}</span>`; }
function progress(value,tone=''){ return `<div class="progress ${tone}"><span style="width:${Math.max(0,Math.min(100,value))}%"></span></div>`; }
function dataFreshness(extra=''){
  return `<div class="data-freshness"><b>Veri güncelliği:</b> ${dataStamp} · ERP cari motoru ve Mikro mutabakat özeti ${extra?`· ${extra}`:''}</div>`;
}
function positionCell(c,side,view){
  const title=side==='customer'?'Müşteri hesabı':'Tedarikçi hesabı';
  const data=c[side==='customer'?'musteri':'tedarikci'];
  if(view!=='summary') return `<div class="position-cell"><div class="position-line"><span>${view}</span><b>${money(data[view],view)}</b></div><span class="row-sub">${title}</span></div>`;
  const active=['TRY','USD','EUR'].filter(cur=>data[cur]>0);
  if(!active.length) return `<span class="muted">Hareket yok</span>`;
  return `<div class="position-cell">${active.map(cur=>`<div class="position-line"><span>${cur}</span><b>${money(data[cur],cur)}</b></div>`).join('')}<span class="row-sub">${title}</span></div>`;
}
function warningFlags(c){
  const arr=[];
  if(c.belgeEksik) arr.push(`<span class="tag compact amber">${c.belgeEksik} eksik belge</span>`);
  if(c.sicilDegisiklik) arr.push(`<span class="tag compact blue">${c.sicilDegisiklik} sicil değişikliği</span>`);
  if(c.mikroFark) arr.push(`<span class="tag compact amber">${money(c.mikroFark,'TRY',false)} Mikro farkı</span>`);
  if(c.siparisBloke||c.sevkiyatBloke) arr.push(`<span class="tag compact red">Blokaj</span>`);
  return arr.length?`<div class="status-stack">${arr.join('')}</div>`:'<span class="tag compact green">Sorun yok</span>';
}
function accountSideName(side){ return side==='customer'?'Müşteri Hesabı':'Tedarikçi Hesabı'; }

function hashToState(){
  const h=location.hash.replace(/^#/,'');
  if(!h||h==='cari-list'){ state.screen='cari-list'; return; }
  const p=h.split('/');
  if(p[0]==='tracking'){
    state.screen='tracking'; state.trackingTab=p[1]||'balances'; return;
  }
  if(p[0]==='cari'&&p[1]){
    const found=cariler.find(x=>String(x.id)===p[1]); if(found) state.selectedCari=found;
    state.screen='detail'; state.detailTab=p[2]||'summary';
    if(state.detailTab==='account') state.accountTab=p[3]||'general';
    if(state.detailTab==='info') state.infoTab=p[3]||'identity';
    if(state.detailTab==='orders') state.orderTab=p[3]||'sales';
    if(state.detailTab==='stock') {
      const stockAliases={incoming:'expected',outsource:'external'};
      const requested=stockAliases[p[3]]||p[3]||'allocated';
      state.stockTab=stockTabs().some(x=>x[0]===requested)?requested:'allocated';
    }
    if(state.detailTab==='docs') state.docsTab=p[3]||'archive';
    return;
  }
  state.screen='cari-list';
}

function renderApp(){
  const root=document.getElementById('root');
  root.innerHTML=`<div class="app ${state.aiOpen?'':'ai-closed'}">${renderSidebar()}<section class="main">${renderTopbar()}<div class="content" id="main-content">${state.screen==='cari-list'?renderCariList():state.screen==='tracking'?renderTracking():renderDetail()}</div></section>${state.aiOpen?renderAI():''}</div>`;
  const ws=document.getElementById('workspace');
  ws.innerHTML=state.workspaceOpen?renderWorkspace():'';
  ws.className='workspace-backdrop'+(state.workspaceOpen?' open':'');
  ws.setAttribute('aria-hidden',state.workspaceOpen?'false':'true');
  const impact=document.getElementById('impact');
  impact.innerHTML=state.impactOpen?renderImpact():'';
  impact.className='impact-backdrop'+(state.impactOpen?' open':'');
  impact.setAttribute('aria-hidden',state.impactOpen?'false':'true');
  const content=document.getElementById('main-content');
  if(content){
    content.addEventListener('scroll',()=>{
      const head=document.getElementById('customer-head');
      if(head) head.classList.toggle('compact',content.scrollTop>80);
    },{passive:true});
  }
}

function showToast(title,text){
  const t=document.getElementById('toast');
  t.innerHTML=`<strong>${title}</strong><span>${text}</span>`;
  t.classList.add('show');
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove('show'),3500);
}
function markWorkspaceDirty(){
  if(!state.workspaceOpen||state.workspaceDirty) return;
  state.workspaceDirty=true;
  const badge=document.getElementById('dirty-badge');
  if(badge) badge.classList.add('show');
}
function closeWorkspace(){
  if(state.workspaceDirty&&!confirm('Kaydedilmemiş değişiklikler var. Çalışma alanını kapatmak istiyor musunuz?')) return;
  state.workspaceOpen=false; state.workspaceDirty=false; renderApp();
}
function openImpact(type){ state.impactType=type; state.impactOpen=true; renderApp(); }

document.addEventListener('click',e=>{
  const set=e.target.closest('[data-set]');
  if(set){
    state[set.dataset.set]=set.dataset.value;
    if(set.dataset.screen) navigate(set.dataset.screen); else renderApp();
    return;
  }
  const screen=e.target.closest('[data-screen]');
  if(screen){ e.preventDefault(); navigate(screen.dataset.screen); return; }
  const openCari=e.target.closest('[data-open-cari]');
  if(openCari){
    const id=openCari.dataset.openCari;
    navigate(`#cari/${id}/summary`);
    return;
  }
  const selectCari=e.target.closest('[data-select-cari]');
  if(selectCari&&!e.target.closest('button,a')){
    state.selectedListCari=Number(selectCari.dataset.selectCari); renderApp(); return;
  }
  const warning=e.target.closest('[data-warning]');
  if(warning){
    const key=warning.dataset.warning;
    state.listWarnings=state.listWarnings.includes(key)?state.listWarnings.filter(x=>x!==key):[...state.listWarnings,key];
    renderApp(); return;
  }
  const step=e.target.closest('[data-workspace-step]');
  if(step){ state.workspaceStep=step.dataset.workspaceStep; renderApp(); return; }
  const impact=e.target.closest('[data-impact]');
  if(impact){ openImpact(impact.dataset.impact); return; }
  const decision=e.target.closest('[data-duplicate-decision]');
  if(decision){
    state.duplicateDecision=decision.dataset.duplicateDecision;
    state.impactOpen=false; state.impactType=null; state.workspaceDirty=true; renderApp();
    showToast('Mükerrerlik kararı kaydedildi',state.duplicateDecision);
    return;
  }
  const action=e.target.closest('[data-action]');
  if(action){
    const a=action.dataset.action;
    if(a==='toggle-ai'){ state.aiOpen=!state.aiOpen; renderApp(); return; }
    if(a==='open-workspace'){
      state.workspaceMode=action.dataset.mode||'new';
      state.workspaceStep=action.dataset.step||'identity';
      state.workspaceOpen=true; state.workspaceDirty=false;
      if(state.workspaceMode==='edit') state.duplicateDecision='Mevcut cari düzenleniyor; mükerrerlik kontrolü gerekmiyor.';
      else state.duplicateDecision=null;
      renderApp(); return;
    }
    if(a==='close-workspace'){ closeWorkspace(); return; }
    if(a==='close-impact'){ state.impactOpen=false; state.impactType=null; renderApp(); }
  }
  const toast=e.target.closest('[data-toast]');
  if(toast){ const parts=toast.dataset.toast.split('|'); showToast(parts[0],parts[1]||''); return; }
});

document.addEventListener('input',e=>{
  if(e.target.closest('.workspace')) markWorkspaceDirty();
});
document.addEventListener('change',e=>{
  if(e.target.closest('.workspace')) markWorkspaceDirty();
});
window.addEventListener('hashchange',()=>{ hashToState(); renderApp(); });
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(state.impactOpen){ state.impactOpen=false; renderApp(); }
    else if(state.workspaceOpen) closeWorkspace();
    else if(state.aiOpen&&window.innerWidth<1600){ state.aiOpen=false; renderApp(); }
  }
});
hashToState();
renderApp();
</script>
</body>
</html>
