<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Göymen ERP — Ürün & Hizmet Çalışma Alanı</title>
  <style>
:root{
  --bg:#eef2f6;
  --surface:#ffffff;
  --surface-2:#f7f9fb;
  --surface-3:#f1f5f8;
  --border:#d8e1e8;
  --border-strong:#b8c6d1;
  --text:#33414d;
  --text-strong:#101b26;
  --muted:#6d7b87;
  --navy:#071b33;
  --navy-2:#0b2c4d;
  --navy-3:#123a61;
  --primary:#1463f3;
  --primary-strong:#0f4dcc;
  --primary-soft:#e9f1ff;
  --primary-line:#b8cffd;
  --teal:#0b7a75;
  --teal-soft:#dcf3f0;
  --teal-line:#9ad7d1;
  --success:#2f7d4f;
  --success-soft:#e4f4e9;
  --success-line:#acd9bd;
  --amber:#b46d18;
  --amber-soft:#fff0d7;
  --amber-line:#f0c98e;
  --danger:#c2413a;
  --danger-soft:#fde7e5;
  --danger-line:#f1b6b1;
  --purple:#7256ac;
  --purple-soft:#eee9fb;
  --purple-line:#d5c9f1;
  --orange:#c96c20;
  --orange-soft:#fff0e3;
  --orange-line:#f2c59f;
  --gray-soft:#edf1f4;
  --shadow-soft:0 4px 14px rgba(21,35,49,.055);
  --shadow:0 10px 28px rgba(19,35,52,.09);
  --shadow-strong:0 24px 64px rgba(6,24,43,.28);
  --radius:12px;
  --radius-sm:8px;
  --sidebar:238px;
  --drawer:398px;
  --topbar:64px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
  font-synthesis:none;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.54}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary-line);outline-offset:2px}
a{color:inherit;text-decoration:none}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.icon.sm{width:15px;height:15px}.icon.lg{width:21px;height:21px}
.hidden{display:none!important}.muted{color:var(--muted)}.num{text-align:right;font-variant-numeric:tabular-nums}.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* APP SHELL */
.app-shell{height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);background:var(--bg)}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,#06172c 100%);color:#fff;display:flex;flex-direction:column;min-width:0;box-shadow:6px 0 18px rgba(4,20,38,.09);z-index:20}
.brand{height:64px;display:flex;align-items:center;gap:11px;padding:0 17px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{width:37px;height:37px;border-radius:10px;background:linear-gradient(145deg,#21a0ff,#2a5cf2 48%,#0d3a70);display:grid;place-items:center;box-shadow:0 8px 18px rgba(20,99,243,.28);font-weight:950;letter-spacing:-.08em}
.brand-mark span{display:block;transform:skew(-12deg);font-size:18px}
.brand-text strong{display:block;font-size:14px;letter-spacing:.035em}.brand-text span{display:block;font-size:9px;color:#a9c7e7;font-weight:850;letter-spacing:.12em;margin-top:2px}
.sidebar-search{padding:11px 11px 6px}.sidebar-search-wrap{position:relative}.sidebar-search input{width:100%;height:36px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.065);color:#fff;padding:0 34px 0 11px;outline:none}.sidebar-search input::placeholder{color:#8ea8c0}.sidebar-search .icon{position:absolute;right:10px;top:9px;color:#9bb4cc}
.nav{padding:4px 9px 14px;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.nav-section-title{font-size:9px;color:#7290aa;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:12px 10px 5px}
.nav-item{width:100%;border:0;background:transparent;color:#d8e5f1;display:flex;align-items:center;gap:10px;min-height:38px;border-radius:9px;padding:8px 10px;margin:2px 0;text-align:left;font-size:12.5px;font-weight:680;transition:.14s ease}
.nav-item:hover{background:rgba(255,255,255,.075);color:#fff}.nav-item.active{background:linear-gradient(135deg,#1365f4,#0e4dce);color:#fff;box-shadow:0 7px 17px rgba(20,99,243,.3)}
.nav-item .label{flex:1;white-space:nowrap}.nav-item .count{min-width:22px;height:20px;border-radius:999px;padding:0 6px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:9px;font-weight:900;color:#cfe1f2}.nav-item.active .count{background:#fff;color:var(--primary)}
.recent{border-top:1px solid rgba(255,255,255,.08);margin:8px 8px 0;padding-top:8px}.recent button{width:100%;border:0;background:transparent;color:#9db5ca;padding:5px 8px;text-align:left;font-size:10px;border-radius:6px}.recent button:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding:11px 13px 13px}.user-mini{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#7959c0,#325da7);display:grid;place-items:center;color:#fff;font-weight:900;position:relative}.avatar:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#35a868;border:2px solid var(--navy);right:-1px;bottom:0}.user-mini strong{display:block;font-size:11px}.user-mini span{display:block;font-size:9px;color:#8ea8c0;margin-top:2px}.collapse-side{margin-left:auto;border:0;background:transparent;color:#9bb4cc;padding:5px}

.main{min-width:0;height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--topbar);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 17px;flex:0 0 auto;z-index:16}
.mobile-menu{display:none}.page-id{min-width:185px}.page-id small{display:block;color:var(--primary);font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:.07em}.page-id strong{display:block;color:var(--text-strong);font-size:15px;margin-top:2px}
.global-search{position:relative;flex:0 1 440px}.global-search input{width:100%;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:0 44px 0 38px;color:var(--text);outline:none}.global-search>.icon:first-child{position:absolute;left:12px;top:10px;color:#7b8994}.shortcut{position:absolute;right:9px;top:8px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:2px 5px;font-size:9px;color:#81909b}
.company-scope{height:37px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);font-weight:720;padding:0 9px;max-width:180px}.top-spacer{flex:1}.top-date{font-size:10.5px;color:var(--muted);white-space:nowrap}
.top-btn{height:38px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:7px;padding:0 10px;font-weight:760;box-shadow:var(--shadow-soft);position:relative}.top-btn:hover{border-color:var(--primary-line);background:var(--primary-soft);color:var(--primary)}.top-btn.ai.active{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary)}.notification-dot{position:absolute;right:4px;top:3px;width:16px;height:16px;background:var(--danger);border:2px solid #fff;border-radius:999px;color:#fff;font-size:8px;display:grid;place-items:center;font-weight:900}
.top-user{display:flex;align-items:center;gap:8px}.top-user strong{display:block;font-size:10.5px;color:var(--text-strong)}.top-user span{display:block;color:var(--muted);font-size:9px;margin-top:1px}

.content-shell{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .18s ease;overflow:hidden}.content-shell.drawer-open{grid-template-columns:minmax(0,1fr) var(--drawer)}
.page{min-width:0;min-height:0;overflow:auto;padding:16px 17px 24px;scrollbar-width:thin}.page-inner{max-width:1540px;margin:0 auto}
.side-drawer{background:#fff;border-left:1px solid var(--border);min-width:0;height:100%;overflow:hidden;transform:translateX(100%);opacity:0;transition:.18s ease;box-shadow:-10px 0 30px rgba(20,34,50,.06);z-index:14}.drawer-open .side-drawer{transform:none;opacity:1}.side-drawer-inner{height:100%;display:flex;flex-direction:column}.drawer-head{padding:13px 14px 11px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:4}.drawer-body{min-height:0;overflow:auto;padding:12px 13px 20px}.drawer-tabs{display:flex;gap:5px;padding:4px;background:var(--surface-3);border-radius:9px;margin-bottom:11px}.drawer-tab{flex:1;height:32px;border:0;background:transparent;border-radius:7px;font-weight:780;color:var(--muted)}.drawer-tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-soft)}

/* PAGE HEADER / TABS */
.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;margin-bottom:8px}.breadcrumb b{color:var(--text)}
.module-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px}.module-head h1{margin:0;color:var(--text-strong);font-size:24px;letter-spacing:-.025em}.module-head p{margin:5px 0 0;color:var(--muted);font-size:11.5px}.module-actions{display:flex;align-items:center;gap:8px}
.module-tabs{display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--border);margin-bottom:13px}.module-tab{height:42px;border:0;background:transparent;padding:0 23px;color:#53616d;font-weight:800;border-bottom:3px solid transparent;position:relative}.module-tab:hover{color:var(--primary)}.module-tab.active{color:var(--primary);border-color:var(--primary)}.module-tab .badge{margin-left:6px;min-width:20px;height:18px;border-radius:999px;background:var(--gray-soft);display:inline-grid;place-items:center;font-size:9px}.module-tab.active .badge{background:var(--primary-soft)}

/* BUTTONS */
.btn{min-height:38px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;font-weight:760;white-space:nowrap;box-shadow:var(--shadow-soft)}.btn:hover{border-color:var(--primary-line);background:var(--primary-soft);color:var(--primary)}.btn.primary{background:linear-gradient(135deg,var(--primary),#0e4ed0);border-color:var(--primary);color:#fff;box-shadow:0 7px 17px rgba(20,99,243,.23)}.btn.primary:hover{background:var(--primary-strong);color:#fff}.btn.soft{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary)}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}.btn.small{min-height:31px;padding:0 9px;font-size:11px}.btn.icon-only{width:38px;padding:0}.btn.link{border:0;box-shadow:none;background:transparent;color:var(--primary);min-height:30px;padding:0 5px}.btn.link:hover{background:var(--primary-soft)}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;display:grid;place-items:center;color:#596a77}.icon-btn:hover{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary)}
.split-btn{display:inline-flex}.split-btn .btn:first-child{border-radius:9px 0 0 9px}.split-btn .btn:last-child{border-radius:0 9px 9px 0;border-left:0;padding:0 8px}

/* TOOLBAR */
.actionbar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-soft);margin-bottom:10px}.context-search{position:relative;flex:1;min-width:220px}.context-search input{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);padding:0 43px 0 38px;outline:none;color:var(--text)}.context-search>.icon:first-child{position:absolute;left:12px;top:11px;color:#798995}.context-ai{position:absolute;right:7px;top:6px;height:28px;border:1px solid var(--primary-line);background:var(--primary-soft);color:var(--primary);border-radius:7px;padding:0 8px;font-weight:850}
.applied-filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px}.applied-label{font-size:10px;color:var(--muted);font-weight:750}.filter-chip{height:29px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:0 8px 0 10px;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:760}.filter-chip button{border:0;background:transparent;padding:0;color:#7d8993;display:grid;place-items:center}.clear-filters{border:0;background:transparent;color:var(--primary);font-size:10.5px;font-weight:800;padding:4px 6px}

/* QUICK GROUPS */
.quick-groups{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px 11px;box-shadow:var(--shadow-soft);margin-bottom:10px}.quick-title{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:850;color:#42515d;margin-bottom:8px}.quick-title span{font-weight:650;color:var(--muted)}.quick-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.quick-btn{height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#45535f;padding:0 12px;font-size:10.5px;font-weight:790;display:inline-flex;align-items:center;gap:6px}.quick-btn:hover{border-color:var(--primary-line);color:var(--primary);background:var(--primary-soft)}.quick-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 12px rgba(20,99,243,.2)}.quick-btn .qcount{font-size:9px;opacity:.75}.subgroup-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}.subgroup-label{font-size:9.5px;color:var(--muted);font-weight:800;margin-right:3px}.subgroup-btn{height:27px;border:0;background:var(--surface-3);border-radius:7px;padding:0 9px;font-size:9.5px;color:#596872;font-weight:760}.subgroup-btn.active{background:var(--teal-soft);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal-line)}

/* CARDS / KPI */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-soft)}.card-head{min-height:48px;border-bottom:1px solid var(--border);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.card-title strong{display:block;color:var(--text-strong);font-size:12px}.card-title span{display:block;color:var(--muted);font-size:9.5px;margin-top:2px}.head-actions{display:flex;align-items:center;gap:7px}
.kpi-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.mini-kpi{border:1px solid var(--border);border-radius:9px;background:#fff;padding:9px}.mini-kpi span{display:block;color:var(--muted);font-size:9px;font-weight:750}.mini-kpi strong{display:block;color:var(--text-strong);font-size:15px;margin-top:5px;font-variant-numeric:tabular-nums}.mini-kpi small{display:block;color:var(--muted);font-size:8.5px;margin-top:2px}

/* TABLES */
.table-card{overflow:hidden}.table-meta{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 11px;border-bottom:1px solid var(--border);background:#fff}.table-meta strong{font-size:11px;color:var(--text-strong)}.table-meta span{color:var(--muted);font-size:10px}.table-tools{display:flex;gap:6px}
.table-wrap{overflow:auto;max-height:calc(100vh - 410px);scrollbar-width:thin;background:#fff}.data-table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}.data-table thead th{position:sticky;top:0;z-index:3;background:#f7f9fb;color:#65737e;font-size:9.5px;text-align:left;font-weight:850;padding:9px 9px;border-bottom:1px solid var(--border);white-space:nowrap}.data-table tbody td{padding:9px 9px;border-bottom:1px solid #e7edf1;vertical-align:middle;font-size:10.5px;background:#fff}.data-table tbody tr{transition:.12s ease}.data-table tbody tr:hover td{background:#f6f9fc}.data-table tbody tr.active td{background:#edf4ff}.data-table tbody tr.selected td{box-shadow:inset 0 1px 0 #d6e4ff,inset 0 -1px 0 #d6e4ff}.data-table .checkbox-col{width:34px;text-align:center}.data-table input[type="checkbox"]{width:15px;height:15px;accent-color:var(--primary)}.row-main{display:block;color:var(--text-strong);font-weight:800;font-size:10.8px}.row-sub{display:block;color:var(--muted);font-size:9.5px;margin-top:2px}.row-code{font-weight:850;color:#314250;white-space:nowrap}.price-cell{font-weight:850;color:#162635;white-space:nowrap;font-variant-numeric:tabular-nums}.price-cell small{font-weight:650;color:var(--muted)}
.table-pagination{height:48px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 11px;background:#fff}.pager{display:flex;align-items:center;gap:4px}.page-btn{width:31px;height:31px;border:1px solid transparent;background:transparent;border-radius:7px;color:#53636f;font-weight:770}.page-btn:hover{background:var(--surface-3)}.page-btn.active{border-color:var(--primary-line);background:var(--primary-soft);color:var(--primary)}.page-size{height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);padding:0 8px}
.context-selection{display:flex;align-items:center;gap:8px;min-height:45px;padding:7px 10px;background:#eef4ff;border-top:1px solid var(--primary-line)}.context-selection strong{color:var(--primary);font-size:10.5px;margin-right:4px}
.empty-state{display:grid;place-items:center;min-height:330px;text-align:center;padding:40px}.empty-icon{width:54px;height:54px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px}.empty-state h3{margin:0;color:var(--text-strong);font-size:15px}.empty-state p{max-width:420px;color:var(--muted);font-size:11px;line-height:1.6;margin:7px auto 14px}

/* TAGS */
.tag{display:inline-flex;align-items:center;min-height:21px;border-radius:6px;padding:2px 7px;font-size:9px;font-weight:850;white-space:nowrap;border:1px solid transparent}.tag.blue{color:#205fb4;background:#e7f0ff;border-color:#c9dcfb}.tag.green{color:var(--success);background:var(--success-soft);border-color:#c7e5d2}.tag.teal{color:var(--teal);background:var(--teal-soft);border-color:#bce3df}.tag.amber{color:var(--amber);background:var(--amber-soft);border-color:#f3d5a7}.tag.red{color:var(--danger);background:var(--danger-soft);border-color:#f2c4c0}.tag.purple{color:var(--purple);background:var(--purple-soft);border-color:var(--purple-line)}.tag.orange{color:var(--orange);background:var(--orange-soft);border-color:var(--orange-line)}.tag.gray{color:#66737e;background:var(--gray-soft);border-color:#dfe6eb}.tag.system:before{content:"S";width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.8);display:grid;place-items:center;margin-right:4px;font-size:7px}.role-stack{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.class-role{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

/* DETAIL DRAWER */
.entity-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.entity-code{font-size:9px;color:var(--muted);font-weight:800}.entity-title{margin:3px 0 2px;color:var(--text-strong);font-size:16px;line-height:1.2}.entity-sub{color:var(--muted);font-size:10px}.entity-actions{display:flex;gap:5px}.entity-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:10px}.summary-item{border:1px solid var(--border);border-radius:8px;background:#fff;padding:8px}.summary-item span{display:block;color:var(--muted);font-size:8.5px;font-weight:750}.summary-item strong{display:block;color:var(--text-strong);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}.summary-item small{display:block;font-size:8px;color:var(--muted);margin-top:1px}.summary-item.good{background:var(--success-soft);border-color:var(--success-line)}

function statusTag(active){return `<span class="tag ${active?'green':'gray'}">${active?'Aktif':'Pasif'}</span>`}
function rolesHtml(roles){return `<div class="role-stack">${roles.map(r=>`<span class="tag ${roleColors[r]||'gray'}" title="${roleLabels[r]||r}">${roleLabels[r]||r}</span>`).join('')}</div>`}
function classTag(c){return `<span class="tag ${classColors[c]||'gray'}">${c}</span>`}
function selectedProduct(){return products.find(x=>x.id===state.selectedProductId)||products[0]}
function selectedService(){return services.find(x=>x.id===state.selectedServiceId)||services[0]}
function effectiveFloor(item){
  const discountFloor=item.listPrice*(1-(item.maxDiscount||0)/100);
  return Math.max(item.minNet||0,discountFloor);
}
function plannedNet(item){return item.planned?item.planned.price*(1-(item.defaultDiscount||0)/100):null}
function productGroupCount(key){return key==='all'?products.length:products.filter(p=>p.groupKey===key).length}
function serviceGroupCount(key){return key==='all'?services.length:services.filter(s=>s.groupKey===key).length}
function searchText(item){return [item.code,item.name,item.technical,item.group,item.subgroup,item.class,item.quality,(item.aliases||[]).join(' ')].join(' ').toLocaleLowerCase('tr-TR')}

function filteredProducts(){
  let rows=[...products];
  if(state.productGroup!=='all') rows=rows.filter(x=>x.groupKey===state.productGroup);
  if(state.productSubgroup&&state.productSubgroup!=='Tümü') rows=rows.filter(x=>x.subgroup===state.productSubgroup);
  const q=state.search.trim().toLocaleLowerCase('tr-TR'); if(q) rows=rows.filter(x=>searchText(x).includes(q));
  if(state.filters.classes.length) rows=rows.filter(x=>state.filters.classes.includes(x.class));
  if(state.filters.roles.length) rows=rows.filter(x=>state.filters.roles.every(r=>x.roles.includes(r)));
  if(state.filters.qualities.length) rows=rows.filter(x=>state.filters.qualities.includes(x.quality));
  if(state.filters.status.length===1) rows=rows.filter(x=>state.filters.status[0]==='Aktif'?x.active:!x.active);
  if(state.filters.package==='missing') rows=rows.filter(x=>x.groupKey==='profile'&&!x.packageCount);
  if(state.filters.price==='missing') rows=rows.filter(x=>!x.listPrice);
  if(state.filters.tradeOnly) rows=rows.filter(x=>x.roles.includes('purchase')&&x.roles.includes('sale')&&!x.roles.includes('produce'));
  return rows;
}
function filteredServices(){
  let rows=[...services];
  if(state.serviceGroup!=='all') rows=rows.filter(x=>x.groupKey===state.serviceGroup);
  const q=state.serviceSearch.trim().toLocaleLowerCase('tr-TR'); if(q) rows=rows.filter(x=>[x.code,x.name,x.group,x.description].join(' ').toLocaleLowerCase('tr-TR').includes(q));
  return rows;
}
function allPriceItems(){
  const ps=products.map(p=>({key:`p-${p.id}`,type:'product',id:p.id,code:p.code,name:p.name,group:p.group+(p.subgroup?` · ${p.subgroup}`:''),price:p.listPrice,unit:p.priceUnit,discount:p.defaultDiscount,maxDiscount:p.maxDiscount,minNet:p.minNet,effective:p.effectiveDate,planned:p.planned,active:p.active}));
  const ss=services.map(s=>({key:`s-${s.id}`,type:'service',id:s.id,code:s.code,name:s.name,group:`Hizmet · ${s.group}`,price:s.listPrice,unit:s.priceUnit,discount:s.defaultDiscount,maxDiscount:s.maxDiscount,minNet:s.minNet,effective:'24.08.2026',planned:null,active:s.active}));
  return [...ps,...ss];
}
function filteredPrices(){
  let rows=allPriceItems(); const q=state.priceSearch.trim().toLocaleLowerCase('tr-TR');
  if(q) rows=rows.filter(x=>[x.code,x.name,x.group].join(' ').toLocaleLowerCase('tr-TR').includes(q));
  if(state.productGroup!=='all') rows=rows.filter(x=>x.type==='product'&&products.find(p=>p.id===x.id)?.groupKey===state.productGroup);
  return rows;
}

function renderImpactBar(){
  const changedKeys=Object.keys(state.changedPrices); const count=new Set([...state.priceSelected,...changedKeys]).size;
  if(!count) return '';
  const rows=allPriceItems().filter(x=>state.priceSelected.has(x.key)||changedKeys.includes(x.key));
  const oldAvg=rows.reduce((s,x)=>s+x.price,0)/(rows.length||1); const newAvg=rows.reduce((s,x)=>s+(state.changedPrices[x.key]?.price??x.price),0)/(rows.length||1);
  const oldDisc=rows.reduce((s,x)=>s+x.discount,0)/(rows.length||1); const newDisc=rows.reduce((s,x)=>s+(state.changedPrices[x.key]?.discount??x.discount),0)/(rows.length||1);
  const oldNet=oldAvg*(1-oldDisc/100); const newNet=newAvg*(1-newDisc/100);
  return `<div class="impact-bar"><div class="impact-primary"><strong>${count} kayıt etkilenecek</strong><span>Toplu güncelleme etki özeti</span></div><div class="impact-metric"><span>Ortalama Liste Fiyatı</span><strong>${trNum(newAvg,0)} TL/ton</strong></div><div class="impact-metric"><span>Ortalama İskonto</span><strong>%${trNum(newDisc,1)}</strong></div><div class="impact-metric"><span>Ortalama Net</span><strong>${trNum(newNet,0)} TL/ton</strong></div><div class="impact-metric"><span>Değişim</span><strong class="${newNet>=oldNet?'match-high':'match-none'}">${newNet>=oldNet?'+':''}${trNum(newNet-oldNet,0)}</strong></div><div class="impact-actions"><button class="btn" data-action="discard-price-changes">Vazgeç</button><button class="btn primary" data-action="open-workspace" data-workspace="bulkPrice">Önizle ve Uygula</button></div></div>`;
}

function runAICommand(text){
  const q=(text||'').trim(); if(!q)return;

  }
  if((l.includes('alıp sattığımız')||l.includes('alıp sat'))&&(l.includes('üretmedi')||l.includes('üretmiyor'))){
    state.screen='products';state.productGroup='all';state.filters.tradeOnly=true;state.drawerOpen=true;state.drawerMode='ai';state.chat.push({from:'ai',text:'Alınabilir ve satılabilir olup üretim çıktısı olmayan ticari ürünleri gösteriyorum.'});renderApp();return;
  }
  if((l.includes('artır')||l.includes('güncelle'))&&(l.includes('fiyat')||l.includes('iskonto'))){
    state.chat.push({from:'ai',text:'Komutu toplu fiyat güncelleme taslağına dönüştürdüm. Etkilenecek ürünleri ve eski/yeni değerleri onaydan önce göstereceğim.'});openWorkspace('aiPrice',{aiText:q});renderApp();return;
  }
  if((l.includes('kopyala')||l.includes('oluştur'))&&(l.includes('50')||l.includes('profil'))){
    const draft={...selectedProduct(),code:'Otomatik',id:undefined,name:'Kutu Profil 50×50×2,00 mm',technical:'S235JR · 6.000 mm',packageCount:81,kgM:3.01,pieceWeight:18.06,packageWeight:1463};
    state.chat.push({from:'ai',text:'Seçili üründen 50×50×2,00 mm profil taslağı hazırladım. Kaydetmeden önce teknik alanları ve mükerrerliği kontrol edin.'});openWorkspace('newProduct',{draft});renderApp();return;
  }
  if(l.includes('fiyat')&&(l.includes('sınır')||l.includes('çelişki'))){
    const p=selectedProduct();state.chat.push({from:'ai',text:`Etkin onaysız alt sınır ${trNum(effectiveFloor(p))} ${p.priceUnit}. Maksimum iskonto kuralı minimum net fiyat kuralından daha koruyucu.`});state.drawerOpen=true;state.drawerMode='ai';renderApp();return;
  }
  state.search=q;state.screen='products';state.drawerOpen=true;state.drawerMode='ai';state.chat.push({from:'ai',text:'Komutu katalog araması olarak uyguladım. Ölçü ve yazım farklılıkları normalize edilerek eşleşmeler getirildi.'});renderApp();
}

    case 'bulk-status': showToast('Durum Güncelleme','Hareket görmüş kartlar silinmez; pasif/arşiv durumuna alınır.');break;
    case 'selection-more': showToast('Diğer İşlemler','Kod, grup, teknik şablon ve dışa aktarma seçenekleri açılır.');break;
    case 'discard-price-changes': state.changedPrices={};state.priceSelected.clear();renderApp();break;
    case 'schedule-price': state.popover=null;openWorkspace('bulkPrice');break;
    case 'run-product-ai': runAICommand(state.search||$('#product-search')?.value);break;
    case 'run-service-ai': if(state.serviceSearch.trim())showToast('AI Hizmet Araması',`“${state.serviceSearch}” için hizmet grubu ve birim eşleşmeleri getirildi.`);else openWorkspace('newService');break;
    case 'send-ai': sendAIFromComposer();break;
    case 'ai-prompt': runAICommand(el.dataset.prompt);break;
    case 'ai-show-missing-package': state.screen='products';state.productGroup='profile';state.filters.package='missing';renderApp();break;
    case 'ai-explain': state.chat.push({from:'ai',text:'Paket standardı; siparişte paket → boy/kg dönüşümünü, üretimde etiket bölme önerisini ve sevkiyatta yük tahminini otomatikleştirir.'});renderApp();break;
    case 'show-toast': showToast(el.dataset.title||'Bilgi',el.dataset.text||'İşlem tamamlandı.');break;
    case 'linked-module': showToast(el.dataset.target,`${el.dataset.target} çalışma alanı seçili kayıt bağlamıyla açılır.`);break;
    case 'workspace-ai': showToast('Workspace AI','Aktif form alanlarını, doğrulama hatalarını ve değişiklik etkisini bağlam olarak kullanır.');break;
    case 'workspace-expand': showToast('Tam Ekran','Workspace zaten tam ekran çalışma düzeninde.');break;
    case 'product-more': showToast('Ürün İşlemleri','Pasife al, paket standardı, mükerrer karşılaştırma ve dışa aktarma seçenekleri.');break;
    default: break;
  }
}
function arraySetToggle(set,value){set.has(value)?set.delete(value):set.add(value)}
function removeFilter(type,value){if(type==='class')state.filters.classes=state.filters.classes.filter(x=>x!==value);else if(type==='role')state.filters.roles=state.filters.roles.filter(x=>x!==value);else if(type==='quality')state.filters.qualities=state.filters.qualities.filter(x=>x!==value);else if(type==='package')state.filters.package='all';else if(type==='price')state.filters.price='all';else if(type==='tradeOnly')state.filters.tradeOnly=false}
function loadView(view){clearFilters();if(view==='profiles'){state.productGroup='profile'}else if(view==='trade'){state.productGroup='all';state.filters.tradeOnly=true}else{state.productGroup='profile';state.filters.package='missing'}state.filterOpen=false;showToast('Görünüm Yüklendi','Filtre ve kolon tercihleri uygulandı.')}

function prepareProductAI(){
  const d=productDraft();Object.assign(d,{name:'Kutu Profil 40×40×1,90 mm',technical:'S235JR · 6.000 mm',group:'Profil',subgroup:'Kutu Profil',class:'Mamul',quality:'S235JR',roles:['purchase','sale'],mainUnit:'kg',purchaseUnit:'ton',saleUnit:'ton',priceUnit:'TL/ton',packageCount:100,lengthM:6,kgM:2.31,pieceWeight:13.86,packageWeight:1386,listPrice:42000,defaultDiscount:25,maxDiscount:28,minNet:30200,active:true});state.workspace.dirty=true;state.workspace.aiPrepared=true;renderWorkspaceRoot();showToast('AI Taslağı Hazır','9 alan doğrulandı; 2 alan kullanıcı kontrolü bekliyor.');
}
function prepareServiceAI(){
  const d=serviceDraft();Object.assign(d,{name:'Fason Profil Çekme',group:'Fason Hizmetler',roles:['purchase','sale','operation'],unit:'ton',priceUnit:'TL/ton',listPrice:1850,defaultDiscount:2,maxDiscount:5,minNet:1760,active:true,description:'Müşteri veya Göymen malzemesinden profil çekme operasyon hizmeti.'});state.workspace.dirty=true;renderWorkspaceRoot();showToast('AI Hizmet Taslağı Hazır','Operasyon, sahiplik ve ücretlendirme alanları kontrol için dolduruldu.');
}
function saveWorkspace(close){
  const w=state.workspace;if(!w)return;
  if(['bulkPrice','aiPrice','excelImport'].includes(w.type)&&w.step<3){w.step++;w.dirty=true;renderWorkspaceRoot();return}
  if(w.type==='newProduct'){
    const d=productDraft();const newId=Math.max(...products.map(x=>x.id))+1;products.push({...selectedProduct(),...d,id:newId,code:`PRF-${String(newId).padStart(5,'0')}`,name:d.name||'Yeni Ürün',technical:`${d.quality||'S235JR'} · ${trNum(d.lengthM||6,3)} m`,groupKey:d.group==='Profil'?'profile':'other',stock:{free:0,reserved:0,total:0},links:{stock:0,orders:0,production:0,docs:0}});state.selectedProductId=newId;state.screen='products';showToast('Ürün Kaydedildi','Yeni ürün kartı aktif kataloğa eklendi.');
  }else if(w.type==='editProduct'){
    Object.assign(selectedProduct(),productDraft());showToast('Ürün Güncellendi','Değişiklik geçmişi ve alan etkisi audit kaydına yazıldı.');
  }else if(w.type==='newService'){
    const d=serviceDraft();const newId=Math.max(...services.map(x=>x.id))+1;services.push({...d,id:newId,code:`HZM-${String(newId-100).padStart(4,'0')}`});state.selectedServiceId=newId;state.screen='services';showToast('Hizmet Kaydedildi','Yeni hizmet kartı aktif kataloğa eklendi.');
  }else if(w.type==='editService'){
    Object.assign(selectedService(),serviceDraft());showToast('Hizmet Güncellendi','Operasyon ve fiyat kuralları kaydedildi.');
  }else if(w.type==='packageStandard'){
    showToast('Paket Standardı Kaydedildi','Yeni sürüm başlangıç tarihinden itibaren geçerli olacak; geçmiş kayıtlar değişmeyecek.');
  }else if(['bulkPrice','aiPrice'].includes(w.type)){
    const keys=state.priceSelected.size?[...state.priceSelected]:filteredPrices().filter(x=>x.type==='product'&&products.find(p=>p.id===x.id)?.groupKey==='profile').map(x=>x.key);
    keys.forEach(key=>{const item=allPriceItems().find(x=>x.key===key);if(item?.type==='product'){const p=products.find(x=>x.id===item.id);p.planned={date:'01.09.2026',price:Math.round(p.listPrice*1.03)};p.defaultDiscount=25;p.maxDiscount=28}});state.changedPrices={};state.priceSelected.clear();showToast('Fiyat Revizyonu Onaya Gönderildi','Planlanan fiyatlar 01.09.2026 başlangıç tarihiyle hazırlanmıştır.');
  }else if(w.type==='excelImport'){
    showToast('Excel Taslağı Onaya Gönderildi','183 eşleşmiş fiyat kaydı için önizleme ve audit paketi oluşturuldu.');
  }else showToast('Kayıt Tamamlandı','Çalışma alanındaki değişiklikler kaydedildi.');
  w.dirty=false;if(close){state.workspace=null;renderApp()}else renderWorkspaceRoot();
}
function sendAIFromComposer(){const input=$('#ai-chat-input');const text=input?.value?.trim();if(!text)return;runAICommand(text)}

function handleDraftInput(el){
  if(!state.workspace)return;state.workspace.dirty=true;
  if(el.dataset.draft){const d=state.workspace.type.includes('Service')?serviceDraft():productDraft();let v=el.value;if(['lengthM','kgM','packageCount','listPrice','defaultDiscount','maxDiscount','minNet'].includes(el.dataset.draft))v=parseTRNumber(v);if(el.dataset.draft==='active')v=el.value==='Aktif';d[el.dataset.draft]=v}
  if(el.id==='product-ai-text')state.workspace.aiText=el.value;if(el.id==='service-ai-text')state.workspace.aiText=el.value;
}

function handlePriceChange(el){
  const key=el.dataset.priceKey,field=el.dataset.priceField;if(!key||!field)return;const item=allPriceItems().find(x=>x.key===key);const value=parseTRNumber(el.value);if(!state.changedPrices[key])state.changedPrices[key]={};state.changedPrices[key][field]=value;state.priceSelected.add(key);renderApp();
}

function handleSearchEnter(el){
  if(el.dataset.input==='product-search'){state.search=el.value;renderApp()}
  else if(el.dataset.input==='service-search'){state.serviceSearch=el.value;renderApp()}
  else if(el.dataset.input==='price-search'){state.priceSearch=el.value;renderApp()}
}

document.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');
  if(el){event.preventDefault();actionHandler(el.dataset.action,el,event);return}
  if(state.popover&&!event.target.closest('[data-popover]')){state.popover=null;renderApp()}
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.dataset.input==='product-search')state.search=el.value;
  if(el.dataset.input==='service-search')state.serviceSearch=el.value;
  if(el.dataset.input==='price-search')state.priceSearch=el.value;
  if(el.dataset.draft||el.id==='product-ai-text'||el.id==='service-ai-text')handleDraftInput(el);
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.priceKey)handlePriceChange(el);
  if(el.dataset.draft){handleDraftInput(el);renderWorkspaceRoot()}
  if(el.dataset.draftRole){const d=productDraft();arrayToggle(d.roles,el.dataset.draftRole);state.workspace.dirty=true;renderWorkspaceRoot()}
  if(el.dataset.input)handleSearchEnter(el);
});
document.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&event.target.matches('[data-input]')){event.preventDefault();handleSearchEnter(event.target)}
  if(event.key==='Enter'&&event.target.id==='ai-chat-input'&&!event.shiftKey){event.preventDefault();sendAIFromComposer()}
  if(event.key==='Escape'){if(state.modal){state.modal=null;renderModalRoot()}else if(state.workspace)requestCloseWorkspace();else if(state.drawerOpen){state.drawerOpen=false;renderApp()}}
});

// Düzeltme: filtre tipleri için çoğul alan adları.
const originalActionHandler=actionHandler;
actionHandler=function(action,el,event){
  if(action==='toggle-filter-option'){
    const map={class:'classes',role:'roles',quality:'qualities',status:'status'};arrayToggle(state.filters[map[el.dataset.type]],el.dataset.value);renderApp();return;
  }
  originalActionHandler(action,el,event);
};

renderApp();

</script>
</body>
</html>
